      // File selection handler for New Report Modal
      handleReportFileSelect(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        if (file.size > 4 * 1024 * 1024) {
          alert("L'immagine selezionata supera il limite consentito di 4 MB.");
          event.target.value = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const base64Data = e.target.result;
          const base64Input = document.getElementById('modal-rep-photo-base64');
          if (base64Input) base64Input.value = base64Data;

          const previewBox = document.getElementById('modal-rep-preview-box');
          const previewImg = document.getElementById('modal-rep-preview-img');
          const previewName = document.getElementById('modal-rep-preview-name');
          const previewSize = document.getElementById('modal-rep-preview-size');

          if (previewBox && previewImg) {
            previewImg.src = base64Data;
            if (previewName) previewName.textContent = file.name;
            if (previewSize) previewSize.textContent = `${(file.size / 1024).toFixed(1)} KB`;
            previewBox.classList.remove('hidden');
          }
        };
        reader.readAsDataURL(file);
      },

      // Clear selected file
      clearReportFile() {
        const fileInput = document.getElementById('modal-rep-file-input');
        const base64Input = document.getElementById('modal-rep-photo-base64');
        const previewBox = document.getElementById('modal-rep-preview-box');
        const previewImg = document.getElementById('modal-rep-preview-img');
        if (fileInput) fileInput.value = "";
        if (base64Input) base64Input.value = "";
        if (previewImg) previewImg.src = "";
        if (previewBox) previewBox.classList.add('hidden');
      },

          const activeFilter = AppState.adminRegRequestsFilter || 'ALL';
          const searchQuery = (AppState.adminRegRequestsSearch || '').toLowerCase().trim();

          const pendingCount = allRequests.filter(r => r.status === 'PENDING').length;
          const approvedCount = allRequests.filter(r => r.status === 'APPROVED').length;
          const rejectedCount = allRequests.filter(r => r.status === 'REJECTED').length;

            if (activeFilter === 'PENDING') return r.status === 'PENDING';

            if (activeFilter === 'REJECTED') return r.status === 'REJECTED';
            return true;

          if (searchQuery) {
            filtered = filtered.filter(r => 
              (r.tia || '').toLowerCase().includes(searchQuery) ||
              (r.fullName || '').toLowerCase().includes(searchQuery) ||
              (r.firstName || '').toLowerCase().includes(searchQuery) ||
              (r.lastName || '').toLowerCase().includes(searchQuery) ||
              (r.qualification || '').toLowerCase().includes(searchQuery)
            );
          }

          filtered.sort((a, b) => {
            if (a.status === 'PENDING' && b.status !== 'PENDING') return -1;

    const AEROPORTO_CTA = { lat: 37.4680, lon: 15.0658 };
    const MAX_RADIUS_METERS = 400; // Raggio max: 400 metri (Terminal A/C, CRU, Varchi Staff e corpo centrale)

    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Raggio terrestre in metri
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      return getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) / 1000;
    }

    async function checkGeofence() {
      const toastId = showToast("Rilevamento coordinate GPS di precisione Terminal/CRU...");
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          removeToast(toastId);
          console.warn("[GPS] Geolocalizzazione non supportata dal dispositivo/browser.");
          resolve({ 
            lat: null, 
            lon: null, 
            distMeters: null, 
            dist: 'N/D', 
            accuracy: null, 
            gpsStatus: "GPS NON SUPPORTATO",
            gpsError: "GPS_NOT_SUPPORTED",
            inBounds: false 
          });
          return;
        }

        let isResolved = false;
        const timer = setTimeout(() => {
          if (!isResolved) {
            isResolved = true;
            removeToast(toastId);
            console.warn("[GPS] Timeout acquisizione coordinate GPS (5s).");
            resolve({ 
              lat: null, 
              lon: null, 
              distMeters: null, 
              dist: 'N/D', 
              accuracy: null, 
              gpsStatus: "TIMEOUT RILEVAMENTO GPS",
              gpsError: "GPS_TIMEOUT",
              inBounds: false 
            });
          }
        }, 5000);

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            if (isResolved) return;
            isResolved = true;
            clearTimeout(timer);
            removeToast(toastId);
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const distMeters = getDistanceFromLatLonInMeters(lat, lon, AEROPORTO_CTA.lat, AEROPORTO_CTA.lon);
            const inBounds = distMeters <= MAX_RADIUS_METERS;
            const statusText = inBounds 
              ? `PRESIDIO CONFERMATO IN SEDIME (distanza: ${distMeters} m)` 
              : `FUORI SEDIME (${distMeters} m)`;

            resolve({ 
              lat: Number(lat.toFixed(6)), 
              lon: Number(lon.toFixed(6)), 
              distMeters: distMeters,
              dist: (distMeters / 1000).toFixed(2), 
              accuracy: Math.round(pos.coords.accuracy || 10),
              gpsStatus: statusText,
              inBounds: inBounds,
              gpsError: null
            });
          },
          (err) => {
            if (isResolved) return;
            isResolved = true;
            clearTimeout(timer);
            removeToast(toastId);
            console.warn("[GPS] Permesso negato o GPS disattivato:", err.message);
            resolve({ 
              lat: null, 
              lon: null, 
              distMeters: null, 
              dist: 'N/D', 
              accuracy: null, 
              gpsStatus: "GPS DISATTIVATO O NON AUTORIZZATO",
              gpsError: "GPS_DISABLED",
              inBounds: false 
            });
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      });
    }

    function extractDriveFileId(input) {
      if (!input) return "";
      const trimmed = input.trim();
      const fileMatch = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileMatch) return fileMatch[1];
      const idMatch = trimmed.match(/id=([a-zA-Z0-9_-]+)/);
      if (idMatch) return idMatch[1];
      const folderMatch = trimmed.match(/folders\/([a-zA-Z0-9_-]+)/);
      if (folderMatch) return folderMatch[1];
      if (/^[a-zA-Z0-9_-]{20,}$/.test(trimmed)) return trimmed;
      return trimmed;
    }

    /* -------------------------------------------------------------
       ARGOS • TACTICAL SECURITY ADVISOR (CRU / PNS ENAC / GEMINI RAG)
    ------------------------------------------------------------- */
    function formatArgosInlines(str) {
      if (!str) return '';

      // 1. Procedural badges in brackets: [CODE-XYZ] (e.g. [EMERG-PROC-07], [SOP-VARCO-01], [REG-UE-2015/1998], [CRU-ALERT-L3], [PNS-11.2])
      let formatted = str.replace(/\[([A-Z0-9_\-\.\/]+)\]/g, (match, code) => {
        if (/^[A-Z0-9][A-Z0-9_\-\.\/]{2,}$/.test(code)) {
          let badgeTheme = "bg-amber-500/20 text-amber-300 border-amber-500/40";
          if (code.includes('EMERG') || code.includes('ALERT') || code.includes('IED') || code.includes('DENY')) {
            badgeTheme = "bg-rose-500/20 text-rose-300 border-rose-500/40";
          } else if (code.includes('CRU') || code.includes('PNS') || code.includes('CORE')) {
            badgeTheme = "bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
          } else if (code.includes('SOP') || code.includes('REG') || code.includes('EDS') || code.includes('ROT')) {
            badgeTheme = "bg-sky-500/20 text-sky-300 border-sky-500/40";
          }
          return `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded font-mono text-[10px] font-bold uppercase tracking-wider ${badgeTheme} border shadow-sm align-baseline mx-0.5"><span class="w-1.5 h-1.5 rounded-full ${code.includes('EMERG') ? 'bg-rose-400 animate-pulse' : 'bg-current'}"></span>${code}</span>`;
        }
        return match;
      });

      // 2. Bold text: **text** (converts double asterisks to real strong tags)
      formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold text-white tracking-wide">$1</strong>');

      // 3. Fallback single asterisks or underscores for italics: *text* or _text_
      formatted = formatted.replace(/(?:^|\s)\*([^*]+)\*(?=\s|$|[.,;:!?])/g, ' <em class="italic text-slate-300">$1</em>');
      formatted = formatted.replace(/(?:^|\s)_([^_]+)_(?=\s|$|[.,;:!?])/g, ' <em class="italic text-slate-300">$1</em>');

      // 4. Inline code: `code`
      formatted = formatted.replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-700 text-sky-300 font-mono text-[11px]">$1</code>');

      // 5. Clean up any remaining double asterisks
      formatted = formatted.replace(/\*\*/g, '');

      return formatted;
    }
    window.formatArgosInlines = formatArgosInlines;

    function renderArgosMarkdown(rawText) {
      if (!rawText) return '';
      
      let text = String(rawText).replace(/\r\n/g, '\n');

      // Escape basic HTML entities safely
      text = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const lines = text.split('\n');
      const outputBlocks = [];
      let inList = false;
      let listType = null;
      let listItems = [];

      function flushList() {
        if (!inList) return;
        if (listType === 'ul') {
          outputBlocks.push(`<ul class="space-y-1.5 my-2 pl-0.5">${listItems.join('')}</ul>`);
        } else if (listType === 'ol') {
          outputBlocks.push(`<ol class="space-y-1.5 my-2 pl-0.5">${listItems.join('')}</ol>`);
        }
        inList = false;
        listType = null;
        listItems = [];
      }

      for (let i = 0; i < lines.length; i++) {
        const rawLine = lines[i];
        const trimmed = rawLine.trim();

        if (!trimmed) {
          flushList();
          continue;
        }

        // Headers: ### or ## or #
        const h3Match = trimmed.match(/^###\s+(.+)$/);
        const h2Match = !h3Match && trimmed.match(/^##\s+(.+)$/);
        const h1Match = !h3Match && !h2Match && trimmed.match(/^#\s+(.+)$/);

        if (h3Match || h2Match || h1Match) {
          flushList();
          const titleContent = formatArgosInlines((h3Match || h2Match || h1Match)[1]);
          
          let badgeStyle = "text-sky-300 border-sky-500/30 bg-sky-950/40";
          let icon = `<svg class="w-3.5 h-3.5 text-sky-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
          
          if (titleContent.includes("INQUADRAMENTO") || titleContent.includes("PNS") || titleContent.includes("ENAC") || titleContent.includes("CIRCOLARI")) {
            badgeStyle = "text-sky-300 border-sky-500/40 bg-sky-950/40 shadow-sm";
            icon = `<svg class="w-3.5 h-3.5 text-sky-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
          } else if (titleContent.includes("AZIONI") || titleContent.includes("SICUREZZA") || titleContent.includes("IMMEDIATE") || titleContent.includes("VINCOLANTI")) {
            badgeStyle = "text-amber-300 border-amber-500/40 bg-amber-950/40 shadow-sm";
            icon = `<svg class="w-3.5 h-3.5 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;
          } else if (titleContent.includes("NOTIFICA") || titleContent.includes("CRU") || titleContent.includes("POLARIA") || titleContent.includes("ALLERTAMENTO")) {
            badgeStyle = "text-purple-300 border-purple-500/40 bg-purple-950/40 shadow-sm";
            icon = `<svg class="w-3.5 h-3.5 text-purple-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`;
          } else if (titleContent.includes("REGISTRAZIONE") || titleContent.includes("VERBALE") || titleContent.includes("CHIUSURA") || titleContent.includes("DOMANDA")) {
            badgeStyle = "text-emerald-300 border-emerald-500/40 bg-emerald-950/40 shadow-sm";
            icon = `<svg class="w-3.5 h-3.5 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`;
          }

          outputBlocks.push(`
            <div class="mt-3.5 mb-1.5 first:mt-0">
              <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg border font-black text-[11px] sm:text-xs tracking-wider uppercase ${badgeStyle}">
                ${icon}
                <span>${titleContent}</span>
              </div>
            </div>
          `);
          continue;
        }

        // Numbered list item: 1. 2. 3.
        const numMatch = trimmed.match(/^(\d+)\.\s+(.+)$/);
        if (numMatch) {
          if (inList && listType !== 'ol') flushList();
          inList = true;
          listType = 'ol';
          const num = numMatch[1];
          const itemContent = formatArgosInlines(numMatch[2]);
          listItems.push(`
            <li class="flex items-start gap-2.5 text-slate-200 leading-relaxed text-xs sm:text-[13px]">
              <span class="px-1.5 py-0.5 rounded font-mono text-[10px] font-bold bg-sky-500/20 text-sky-300 border border-sky-500/30 shrink-0 mt-0.5 shadow-sm">${num}</span>
              <div class="flex-1 min-w-0">${itemContent}</div>
            </li>
          `);
          continue;
        }

        // Bullet list item: - or *
        const bulletMatch = trimmed.match(/^[-*•]\s+(.+)$/);
        if (bulletMatch) {
          if (inList && listType !== 'ul') flushList();
          inList = true;
          listType = 'ul';
          const itemContent = formatArgosInlines(bulletMatch[1]);
          listItems.push(`
            <li class="flex items-start gap-2.5 text-slate-200 leading-relaxed text-xs sm:text-[13px]">
              <span class="w-1.5 h-1.5 rounded-full bg-sky-400 shrink-0 mt-2 shadow-[0_0_6px_#38bdf8]"></span>
              <div class="flex-1 min-w-0">${itemContent}</div>
            </li>
          `);
          continue;
        }

        // Regular paragraph
        flushList();
        const inlines = formatArgosInlines(trimmed);
        
        // Highlight closing questions
        if (trimmed.endsWith('?') || inlines.includes('?</span>') || trimmed.startsWith('Confermi') || trimmed.startsWith('Specificare')) {
          outputBlocks.push(`
            <div class="p-2.5 sm:p-3 my-2 bg-[#091420] border border-sky-500/30 rounded-xl flex items-start gap-2.5 text-sky-200 text-xs sm:text-[13px] leading-relaxed shadow-sm">
              <span class="text-sky-400 shrink-0 mt-0.5"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
              <div class="flex-1">${inlines}</div>
            </div>
          `);
        } else {
          outputBlocks.push(`<p class="my-1.5 leading-relaxed text-slate-200 text-xs sm:text-[13px]">${inlines}</p>`);
        }
      }

      flushList();
      return outputBlocks.join('');
    }

    window.updateWheelSelection = (id, prefix) => {
       const container = document.getElementById(id);
       if(!container) return;
       const itemHeight = 32;
       const index = Math.round(container.scrollTop / itemHeight);
       const items = container.querySelectorAll('[data-val]');
       items.forEach((el, i) => {
           if(i === index) {
               el.classList.add('text-white', 'font-bold', 'text-sky-400');
               el.classList.remove('text-slate-400');
           } else {
               el.classList.remove('text-white', 'font-bold', 'text-sky-400');
               el.classList.add('text-slate-400');
           }
       });
       
       if (id.includes('-month') || id.includes('-year')) {
           window.updateWheelDays(prefix);
       }
    };
    
    window.getWheelValue = (id) => {
       const container = document.getElementById(id);
       if(!container) return null;
       const itemHeight = 32;
       const index = Math.round(container.scrollTop / itemHeight);
       const items = container.querySelectorAll('[data-val]');
       if(items[index]) return items[index].getAttribute('data-val');
       return null;
    };
    
    window.setWheelValue = (id, val) => {
       const container = document.getElementById(id);
       if(!container) return;
       const items = container.querySelectorAll('[data-val]');
       let index = 0;
       items.forEach((el, i) => { if(el.getAttribute('data-val') == val) index = i; });
       container.scrollTop = index * 32;
       window.updateWheelSelection(id, id.split('-')[0]);
    };
    
    window.updateWheelDays = (prefix) => {
       const monthVal = window.getWheelValue(prefix + '-month');
       const yearVal = window.getWheelValue(prefix + '-year');
       if(!monthVal || !yearVal) return;
       const month = parseInt(monthVal);
       const year = parseInt(yearVal);
       const currentDay = parseInt(window.getWheelValue(prefix + '-day')) || 1;
       
       const maxDays = new Date(year, month, 0).getDate();
       const dayContainer = document.getElementById(prefix + '-day');
       if(!dayContainer) return;
       
       const currentItems = dayContainer.querySelectorAll('[data-val]');
       if (currentItems.length === maxDays) return;
       
       let html = '<div class="h-16"></div>';
       for(let i=1; i<=maxDays; i++) {
           let val = i < 10 ? '0'+i : i.toString();
           html += `<div class="h-8 flex items-center justify-center snap-center text-slate-400 text-base" data-val="${val}">${val}</div>`;
       }
       html += '<div class="h-16"></div>';
       
       dayContainer.innerHTML = html;
       let newDay = Math.min(currentDay, maxDays);
       let targetVal = newDay < 10 ? '0'+newDay : newDay.toString();
       setTimeout(() => window.setWheelValue(prefix + '-day', targetVal), 10);
    };
    
    window.handleDateRangeChange = (val) => {

          AppState.punchesFilters.dateRange = 'CUSTOM';
          ModalManager.openCustomDateRangeModal();
       } else {
          AppState.punchesFilters.dateRange = val;
          renderApp();
       }
    };

       }
       
       let csvContent = "\uFEFF"; // BOM for Excel
       csvContent += "Data;Matricola TIA;Nominativo;Inizio Turno;Pausa Fruita;Fine Turno;Ore Totali Lavorate;Ore Notturno (20-08);Esito Turno;Validazione GPS\n";
       
       punches.forEach(p => {

             pauseStr,
             p.shiftEnd || '',
             computedW,
             computedN,
             p.status,
             gpsStr
          ];
          csvContent += row.join(';') + "\n";
       });
       
       const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
       const url = URL.createObjectURL(blob);
       const link = document.createElement("a");
       link.setAttribute("href", url);
       const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
       link.setAttribute("download", `SAC_Desk_Registro_Presenze_${dateStr}.csv`);

    window.updateApprovalCoherenceTip = function() {
      const tipContainer = document.getElementById('approval-coherence-tip-container');
      if (!tipContainer) return;
      
      const isDutyChecked = (dutyId) => {
        const el = document.getElementById(`approval-duty-${dutyId}`);
        return el ? el.checked : false;
      };
      const isCertChecked = (code) => {
        const el = document.getElementById(`approval-cert-${code}`);
        return el ? el.checked : false;
      };

      const warnings = [];

      if (isDutyChecked('DUTY_RX') && !isCertChecked('A1') && !isCertChecked('A2')) {
        warnings.push(`Per l'attività di <strong>Operatore Radiogeno RX / EDS</strong> è raccomandata l'abilitazione <strong>Cat. A1 (Pax/Bagagli)</strong> o <strong>Cat. A2 (Merci/Posta)</strong>.`);
      }
      if ((isDutyChecked('DUTY_SUPERVISOR') || isDutyChecked('DUTY_CAPOTURNO')) && !isCertChecked('A11')) {
        warnings.push(`Per il ruolo di <strong>Supervisore / Capoturno</strong> è raccomandata l'abilitazione direttiva <strong>Cat. A11 (Supervisore Sicurezza Aeroportuale)</strong>.`);
      }
      if (isDutyChecked('DUTY_MANAGER') && !isCertChecked('A12') && !isCertChecked('A12bis')) {
        warnings.push(`Per il ruolo di <strong>Security Manager / Coordinatore</strong> è raccomandata l'abilitazione direttiva <strong>Cat. A12</strong> o <strong>Cat. A12bis</strong>.`);
      }
      if (isDutyChecked('DUTY_CONTROL_ROOM') && !isCertChecked('A5')) {
        warnings.push(`Per il presidio di <strong>Sala Controllo / Control Room</strong> è raccomandata l'abilitazione <strong>Cat. A5 (Accessi & Controllo)</strong>.`);
      }

      const anyDuty = ['DUTY_RX', 'DUTY_CONTROL_ROOM', 'DUTY_CAPOTURNO', 'DUTY_SUPERVISOR', 'DUTY_MANAGER'].some(isDutyChecked);
      if (!anyDuty) {
        warnings.push(`Seleziona almeno una mansione operativa per l'inquadramento del dipendente.`);
      }

      if (warnings.length > 0) {
        tipContainer.innerHTML = `
          <div class="p-2.5 rounded-xl bg-amber-950/40 border border-amber-500/50 text-amber-200 text-xs flex items-start space-x-2">
            <span class="text-amber-400 text-sm leading-none shrink-0 mt-0.5">⚠️</span>
            <div class="space-y-1 text-[11px] leading-relaxed">
              ${warnings.map(w => `<div>${w}</div>`).join('')}
            </div>
          </div>
        `;
      } else {
        tipContainer.innerHTML = `
          <div class="p-2.5 rounded-xl bg-emerald-950/30 border border-emerald-500/40 text-emerald-200 text-xs flex items-start space-x-2">
            <span class="text-emerald-400 text-sm leading-none shrink-0 mt-0.5">✅</span>
            <div class="leading-relaxed text-[11px]">Coerenza mansionario operativo e abilitazioni certificata conforme al Programma Nazionale di Sicurezza (PNS 11.2).</div>
          </div>
        `;
      }
    };

    window.commitAdminApproval = function(tia) {
      const user = getUserByTia(tia);
      if (!user) {
        showToast("Operatore non trovato.", "error");
        return;
      }

      // Raccoglie mansionario operativo multiplo
      const checkedDuties = [];
      OPERATIONAL_DUTIES.forEach(d => {
        const cb = document.getElementById(`approval-duty-${d.id}`);
        if (cb && cb.checked) {
          checkedDuties.push(d.id);
        }
      });
      if (checkedDuties.length === 0) {
        checkedDuties.push('DUTY_RX');
      }
      user.operationalDuties = checkedDuties;

      // Salva ambiti di delega se Coordinatore
      if (checkedDuties.includes('DUTY_COORDINATORE')) {
        const dels = [];
        COORDINATOR_DELEGATIONS.forEach(del => {
          const cb = document.getElementById(`approval-delega-${del.id}`);
          if (cb && cb.checked) {
            dels.push(del.id);
          }
        });
        user.coordinatorDelegations = dels;
      } else {
        user.coordinatorDelegations = [];
      }

      user.role = checkedDuties.includes('DUTY_MANAGER') ? 'ADMIN' : 'OPERATORE';
      user.qualification = getUserDutiesLabel(user);

      // Salva abilitazioni selezionate con relative scadenze
      user.certifications = {};
      const allCodes = ['A1', 'A2', 'A3', 'A4', 'A5', 'A6', 'A11', 'A12', 'A12bis'];
      allCodes.forEach(code => {
        const cb = document.getElementById(`approval-cert-${code}`);
        const input = document.getElementById(`approval-exp-${code}`);
        if (cb && cb.checked) {
          user.certifications[code] = {
            code: code,
            active: true,
            expiryDate: (input && input.value) ? input.value : getTwoYearsFromToday()
          };
        }
      });

      const decNum = (document.getElementById('approval-decreto-numero')?.value || '').trim();
      const decRil = (document.getElementById('approval-decreto-rilascio')?.value || '').trim();
      const decScad = (document.getElementById('approval-decreto-scadenza')?.value || '').trim();

      if (decNum) user.decretoNumero = decNum;
      if (decRil) user.decretoRilascio = decRil;
      if (decScad) user.decretoScadenza = decScad;

      user.status = "ATTIVO";
      const nowMs = Date.now();
      user.approvedAt = nowMs;
      const currentAdmin = getCurrentUser();
      const adminName = currentAdmin ? `${currentAdmin.tia} (${currentAdmin.fullName || 'Admin'})` : 'ADMIN';
      user.approvedBy = currentAdmin ? currentAdmin.tia : 'ADMIN';
      saveUsers();

      // Aggiorna lo storico accreditamenti
      if (!AppState.registrationRequests) AppState.registrationRequests = [];
      let req = AppState.registrationRequests.find(r => r.tia === tia);
      if (req) {
        req.status = "APPROVED";
        req.role = user.role;
        req.operationalDuties = user.operationalDuties;
        req.qualification = user.qualification;
        req.resolvedAt = nowMs;
        req.resolvedDateFormatted = new Date(nowMs).toLocaleString('it-IT');
        req.resolvedBy = adminName;
        const activeCertsList = Object.keys(user.certifications).join(', ');
        req.notes = `Accreditamento convalidato e autorizzato. Mansioni assegnate: ${user.qualification}. Abilitazioni ENAC attivate: ${activeCertsList || 'Nessuna'}.${user.decretoNumero ? ` Decreto: ${user.decretoNumero}.` : ''}`;
      }
      saveRegistrationRequests();

    window.recalcEditBadge = function(code) {
      const cb = document.getElementById(`edit-cert-active-${code}`);
      const input = document.getElementById(`edit-cert-date-${code}`);
      const badgeContainer = document.getElementById(`edit-badge-${code}`);
      if (!badgeContainer) return;

      const isActive = cb ? cb.checked : false;
      const expDate = input ? input.value : '';
      const expired = isActive && isCertExpired(expDate);

      if (!isActive) {
        badgeContainer.innerHTML = `<span class="px-1.5 py-0.2 rounded font-mono text-[9px] bg-slate-800 text-slate-400">DISATTIVA</span>`;
      } else if (expired) {
        badgeContainer.innerHTML = `<span class="px-1.5 py-0.2 rounded font-bold text-[9px] bg-rose-600 text-white animate-pulse">SCADUTA</span>`;
      } else {
        badgeContainer.innerHTML = `<span class="px-1.5 py-0.2 rounded font-mono font-bold text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">ATTIVA</span>`;
      }
    };

    window.recalcDecretoStatus = function() {
      const numInput = document.getElementById('edit-decreto-numero');
      const expInput = document.getElementById('edit-decreto-scadenza');
      const badge = document.getElementById('edit-decreto-status-badge');
      if (!badge) return;

      const num = numInput ? numInput.value.trim() : '';
      const exp = expInput ? expInput.value : '';
      const expired = exp && isCertExpired(exp);

      if (expired) {
        badge.innerHTML = `<span class="px-2 py-0.5 rounded font-bold text-[10px] bg-rose-600 text-white animate-pulse">DECRETO SCADUTO</span>`;
      } else if (num) {
        badge.innerHTML = `<span class="px-2 py-0.5 rounded font-bold text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">DECRETO REGOLARE</span>`;

      }
    };

    window.saveOperatorCertifications = function(tia, fromPersonnel = false) {
      const user = getUserByTia(tia);
      if (!user) {
        showToast("Operatore non trovato.", "error");
        return;
      }

      // Aggiorna Dati Anagrafici & Inquadramento se presenti nei campi di input
      const fnInput = document.getElementById('edit-operator-fullname');
      if (fnInput && fnInput.value.trim()) {
        user.fullName = fnInput.value.trim();
        const parts = user.fullName.split(' ');
        user.firstName = parts[0] || user.firstName;
        user.lastName = parts.slice(1).join(' ') || user.lastName;
      }
      const phoneInput = document.getElementById('edit-operator-phone');
      if (phoneInput) {
        user.phone = phoneInput.value.trim();
      }
      const stationInput = document.getElementById('edit-operator-station');
      if (stationInput) {
        user.station = stationInput.value.trim();
      }
      const statusSelect = document.getElementById('edit-operator-status');
      if (statusSelect && statusSelect.value) {
        user.status = statusSelect.value;
      }

      const currentUser = getCurrentUser();
      const currentLevel = getUserSecurityLevel(currentUser);
      const isLevel4 = currentLevel >= 4;

      // Raccoglie mansionario operativo multiplo da editor
      const checkedDuties = [];
      OPERATIONAL_DUTIES.forEach(d => {
        const cb = document.getElementById(`edit-duty-${d.id}`);
        if (cb && cb.checked) {
          checkedDuties.push(d.id);
        }
      });
      if (checkedDuties.length > 0) {
        user.operationalDuties = checkedDuties;
        if (checkedDuties.includes('DUTY_COORDINATORE')) {
          const dels = [];
          COORDINATOR_DELEGATIONS.forEach(del => {
            const cb = document.getElementById(`edit-delega-${del.id}`);
            if (cb && cb.checked) {
              dels.push(del.id);
            }
          });
          user.coordinatorDelegations = dels;
        } else {
          user.coordinatorDelegations = [];
        }
        
        // Deriva il ruolo e inquadramento direttamente dalle mansioni operative selezionate
        if (isSuperAdmin(user) || user.tia === 'TIA-90001') {
          user.role = 'ADMIN';
          user.isSuperAdmin = true;
        } else if (checkedDuties.includes('DUTY_MANAGER')) {
          user.role = 'ADMIN';
        } else if (checkedDuties.includes('DUTY_COORDINATORE')) {
          user.role = 'COORDINATORE';
        } else if (checkedDuties.includes('DUTY_SUPERVISOR') || checkedDuties.includes('DUTY_CAPOTURNO')) {
          user.role = 'SUPERVISORE';
        } else {
          user.role = 'OPERATORE';
        }
        user.qualification = getUserDutiesLabel(user);
      }

      const allCodes = ['A1', 'A2', 'A3', 'A4', 'A5', 'A6', 'A11', 'A12', 'A12bis'];
      user.certifications = user.certifications || {};

      // Coordinatori (Livello 3) gestiscono A1-A6; Admin (Livello 4) gestisce tutte le abilitazioni
      const codesToSave = isLevel4 ? allCodes : ['A1', 'A2', 'A3', 'A4', 'A5', 'A6'];
      codesToSave.forEach(code => {
        const cb = document.getElementById(`edit-cert-active-${code}`);
        const input = document.getElementById(`edit-cert-date-${code}`);
        if (!cb) return;
        const isActive = cb.checked;
        const expDate = input ? input.value : getTwoYearsFromToday();

        if (isActive) {
          user.certifications[code] = {
            code: code,
            active: true,
            expiryDate: expDate
          };
        } else {
          if (user.certifications[code]) {
            user.certifications[code].active = false;
          }
        }
      });

      // Modifica Decreti Prefettizi riservata a Livello 4 (Admin)
      let decNum = user.decretoNumero || '';
      let decRil = user.decretoRilascio || '';
      let decScad = user.decretoScadenza || '';

      if (isLevel4) {
        decNum = (document.getElementById('edit-decreto-numero')?.value || '').trim();
        decRil = (document.getElementById('edit-decreto-rilascio')?.value || '').trim();
        decScad = (document.getElementById('edit-decreto-scadenza')?.value || '').trim();

        user.decretoNumero = decNum;
        user.decretoRilascio = decRil;
        user.decretoScadenza = decScad;
      }

      // Archivia variazione nello storico dell'operatore
      user.certHistory = user.certHistory || [];
      const currentAdmin = getCurrentUser();
      const activeList = Object.keys(user.certifications).filter(k => user.certifications[k] && user.certifications[k].active).join(', ');
      user.certHistory.unshift({
        timestamp: new Date().toLocaleString('it-IT'),
        admin: currentAdmin ? `${currentAdmin.tia} (${currentAdmin.fullName || 'Admin'})` : 'ADMIN',
        duties: getUserDutiesLabel(user),
        activeCerts: activeList || 'Nessuna',
        decreto: decNum || 'N/D'
      });

      saveUsers();
      showToast(`Dati anagrafici, Mansioni, Certificazioni ENAC e Decreto aggiornati per ${user.fullName}.`, "info");
      ModalManager.openOperatorModal(tia, fromPersonnel);
      renderApp();
    };

    window.adminRejectUser = function(tia) {
      const u = AppState.users.find(usr => usr.tia === tia);
      const currentAdmin = getCurrentUser();
      const nowMs = Date.now();
      const dateStr = new Date(nowMs).toLocaleString('it-IT');
      const adminName = currentAdmin ? `${currentAdmin.tia} (${currentAdmin.fullName || 'Admin'})` : 'ADMIN';
      const name = u ? (u.fullName || u.tia) : tia;

      // Aggiorna o crea il record nel Registro Storico come REJECTED (non scompare nel nulla)
      if (!AppState.registrationRequests) AppState.registrationRequests = [];
      let req = AppState.registrationRequests.find(r => r.tia === tia);
      if (!req && u) {
        req = {
          id: 'REQ-' + (u.tia ? u.tia.replace(/^TIA-/i, '') : Date.now()),
          tia: u.tia,
          firstName: u.firstName || (u.fullName ? u.fullName.split(' ')[0] : 'Operatore'),
          lastName: u.lastName || (u.fullName ? u.fullName.split(' ').slice(1).join(' ') : u.tia),
          fullName: u.fullName || u.tia,
          birthDate: u.birthDate || 'Non specificata',
          role: u.role || 'OPERATORE',
          operationalDuties: u.operationalDuties || ['DUTY_RX'],
          qualification: u.qualification || 'Operatore Radiogeno RX / EDS',
          requestedAt: u.requestedAt || (nowMs - 3600000),
          requestDateFormatted: u.requestDateFormatted || dateStr
        };
        AppState.registrationRequests.unshift(req);
      }

      if (req) {
        req.status = "REJECTED";
        req.resolvedAt = nowMs;
        req.resolvedDateFormatted = dateStr;
        req.resolvedBy = adminName;
        req.notes = "Richiesta di accreditamento respinta dall'Amministratore. Accesso negato.";
      }

      // Rimuove l'operatore dall'elenco degli utenti del sistema
      AppState.users = (AppState.users || []).filter(usr => usr.tia !== tia);
      saveUsers();
      saveRegistrationRequests();

      showToast(`Richiesta di accreditamento per ${name} (${tia}) RESPINTA e archiviata nello Storico.`, "error");
      renderApp();
      if (ModalManager._personnelModalOpen) {
        ModalManager.openPersonnelModal();
      }
      if (ModalManager._historyModalOpen) {
        ModalManager.openRegistrationHistoryModal();
      }
    };

        showToast("Impossibile eliminare l'account Admin attualmente in uso.", "error");

      const user = getUserByTia(tia);
      const userName = user ? user.fullName : tia;

      // 1. Rimuovi operatore da AppState.users (e revoca credenziali)
      AppState.users = (AppState.users || []).filter(u => u.tia !== tia);
      saveUsers();

      // 2. Aggiorna lo stato anche nello Storico Accreditamenti se presente
      if (AppState.registrationRequests) {
        const req = AppState.registrationRequests.find(r => r.tia === tia);
        if (req) {
          req.status = "REJECTED";
          req.resolvedAt = Date.now();
          req.resolvedDateFormatted = new Date().toLocaleString('it-IT');
          req.resolvedBy = currentAdmin ? `${currentAdmin.tia} (${currentAdmin.fullName || 'Admin'})` : 'ADMIN';
          req.notes = "Account revocato ed eliminato dall'Amministratore.";
          saveRegistrationRequests();
        }
      }

      // 3. Se l'operatore rimosso aveva una sessione di turno attiva
      if (AppState.activeShift && AppState.activeShift.tia === tia) {
        AppState.activeShift = null;
        safeRemoveItem(DB_KEYS.ACTIVE_SHIFT);
      }

      // 4. Mostra toast di conferma
      showToast("Operatore eliminato e credenziali revocate con successo.", "info");

      // 5. Chiudi la scheda operatore e torna automaticamente all'elenco della Console Anagrafica
      ModalManager.openPersonnelModal();

      // 6. Aggiorna lo stato globale e re-render dell'app
      renderApp();

    /* -------------------------------------------------------------
       ADMIN WORKFLOW: RECONCILIATIONS ENGINE & ACTIONS
    ------------------------------------------------------------- */
    window.adminApproveReconciliation = function(punchId) {
      const punch = AppState.punches.find(p => p.id === punchId);
      const anomaly = AppState.pendingAnomalies.find(a => a.punchId === punchId);
      if (!punch) return;

      const exitTime = (anomaly && anomaly.requestedShiftEnd) || punch.requestedShiftEnd;
      if (!exitTime) {
        showToast("Orario di uscita effettivo non indicato.", "error");
        return;
      }

      const [th, tm] = exitTime.split(':').map(Number);
      const startTs = (anomaly && anomaly.startTimestamp) || punch.startTimestamp || Date.now();
      const endD = new Date(startTs);
      endD.setHours(th, tm, 0, 0);
      if (endD.getTime() < startTs) {
        endD.setDate(endD.getDate() + 1);
      }

      let pauseMins = (anomaly && anomaly.pauseDurationMinutes) || punch.pauseDurationMinutes || 0;
      let totalMins = Math.max(0, Math.floor((endD.getTime() - startTs) / 60000) - pauseMins);
      const wh = Math.floor(totalMins / 60);
      const wm = totalMins % 60;

      const currentAdmin = getCurrentUser();
      const nowMs = Date.now();
      const nowFormatted = new Date(nowMs).toLocaleString('it-IT');

      // 1. Valida il turno impostando l'orario di uscita effettivo
      punch.shiftEnd = exitTime;
      punch.workedHours = `${wh}h ${wm}m`;
      // 2. Registra lo stato come "CONCILIATO E APPROVATO"
      punch.status = "CONCILIATO E APPROVATO";
      punch.adminApprovedBy = currentAdmin.tia;
      punch.adminApprovedAt = nowMs;
      punch.adminApprovedAtFormatted = nowFormatted;

      // Rimuovi da pending anomalies
      AppState.pendingAnomalies = AppState.pendingAnomalies.filter(a => a.punchId !== punchId);

      // Notifica operatore
      if (!AppState.notifications) AppState.notifications = [];
      AppState.notifications.unshift({
        id: 'notif-' + nowMs,
        tia: punch.tia,
        type: 'APPROVATA',
        title: 'Rettifica Turno Convalidata',
        message: `La richiesta di riconciliazione per il turno del ${punch.date} (${punch.shiftStart}) è stata approvata da ${currentAdmin.fullName} (${currentAdmin.tia}) con orario uscita ${exitTime}. Stato: CONCILIATO E APPROVATO.`,
        timestamp: nowMs,
        dateStr: nowFormatted,
        read: false
      });

      savePunches();
      savePendingAnomalies();
      saveNotifications();
      showToast("Turno convalidato: CONCILIATO E APPROVATO.", "info");
      renderApp();
    };

    /* -------------------------------------------------------------
       VIEW 3: NATIVE TOP SECRET ARCHIVE (VFS NAVIGATION)
    ------------------------------------------------------------- */
    window.navigateArchiveRoot = () => {
      AppState.archive.currentFolderId = null;
      AppState.archive.path = [];
      renderApp();
    };

    window.navigateArchiveTo = (pathIndex) => {
      if (pathIndex === -1) {
        navigateArchiveRoot();
      } else {
        const p = AppState.archive.path[pathIndex];
        AppState.archive.currentFolderId = p.id;
        AppState.archive.path = AppState.archive.path.slice(0, pathIndex + 1);
        renderApp();
      }
    };

    window.navigateArchiveBack = () => {
      if (AppState.archive.path.length <= 1) {
        navigateArchiveRoot();
      } else {
        navigateArchiveTo(AppState.archive.path.length - 2);
      }
    };

    window.navigateArchiveOpen = (id, name) => {
      AppState.archive.currentFolderId = id;
      AppState.archive.path.push({ id, name });
      renderApp();
    };

    window.openArchivePdfById = (id) => {
      const allNodes = AppState.archiveNodes || ARCHIVE_NODES || [];
      const f = allNodes.find(n => n.id === id);
      if (!f) return;
      ModalManager.openPdfViewerModal({
        title: f.name,
        code: f.code || (f.name || '').replace(/\.pdf$/i, ""),
        fileId: f.fileId || f.id,
        summary: f.summary || "Documento Operativo TOP SECRET S.A.C.",
        fullText: f.fullText || f.name
      });
    };

            ${AiAssistant.isLoading ? `

          <!-- Combinatorial Procedural Matrix (4 Scenarios + Shuffle + Novel AI Case) (shrink-0) -->

            <!-- Novel AI Case button -->

            <!-- Dynamic Chips Container from Combinatorial Matrix -->

    /* -------------------------------------------------------------
       VIEW 5: TIMBRATURE & PUNCHES LOG
    ------------------------------------------------------------- */
    function renderPunchesView() {
      const user = getCurrentUser();
      let punches = [];
      let filtersHtml = '';
      let totalWorkedMinutes = 0;
      let anomaliesHtml = '';

      if (!AppState.punchesFilters) {
        AppState.punchesFilters = { operatorTia: 'ALL', dateRange: 'ALL' };
      }

      if (user.role === 'ADMIN') {
        let filtered = AppState.punches;
        // Filtro Operatore
        if (AppState.punchesFilters.operatorTia !== 'ALL') {
          filtered = filtered.filter(p => p.tia === AppState.punchesFilters.operatorTia);
        }
        
        // Filtro Data
        const todayStr = new Date().toLocaleDateString('it-IT');
        if (AppState.punchesFilters.dateRange === 'TODAY') {
          filtered = filtered.filter(p => p.date === todayStr);
        } else if (AppState.punchesFilters.dateRange === 'LAST_7') {
          const sevenDaysAgo = new Date();
          sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
          filtered = filtered.filter(p => {
             const [day, month, year] = p.date.split('/');
             const d = new Date(year, month - 1, day);
             return d >= sevenDaysAgo;
          });
        } else if (AppState.punchesFilters.dateRange === 'THIS_MONTH') {
          const currentMonth = new Date().getMonth();
          const currentYear = new Date().getFullYear();
          filtered = filtered.filter(p => {
             const [day, month, year] = p.date.split('/');
             return parseInt(month) - 1 === currentMonth && parseInt(year) === currentYear;
          });
        } else if (AppState.punchesFilters.dateRange === 'CUSTOM') {
          if (AppState.punchesFilters.customStartDate && AppState.punchesFilters.customEndDate) {
            const parseD = (s) => { const [d,m,y]=s.split('/'); return new Date(y, m-1, d); };
            const sd = parseD(AppState.punchesFilters.customStartDate);
            sd.setHours(0,0,0,0);
            const ed = parseD(AppState.punchesFilters.customEndDate);
            ed.setHours(23,59,59,999);
            filtered = filtered.filter(p => {
              const pd = parseD(p.date);
              return pd >= sd && pd <= ed;
            });
          }
        }
        punches = filtered;

        // Calcolo ore totali & notturno
        let totalNightMinutes = 0;
        punches.forEach(p => {
          if (p.status !== "IN CORSO" && p.status !== "IN PAUSA" && !p.status.includes("ANOMALIA")) {
             const metrics = getShiftMetrics(p);
             totalWorkedMinutes += metrics.worked;
             totalNightMinutes += metrics.night;
             p._computedWorked = metrics.displayWorked;
             p._computedNight = metrics.displayNight;
          }
        });
        const totalH = Math.floor(totalWorkedMinutes / 60);
        const totalM = totalWorkedMinutes % 60;
        const totalWorkedDisplay = `${totalH}h ${totalM}m`;
        
        const nightH = Math.floor(totalNightMinutes / 60);
        const nightM = totalNightMinutes % 60;
        const totalNightDisplay = `${nightH}h ${nightM}m`;

        // Costruisci le opzioni per gli operatori
        const uniqueTias = [...new Set(AppState.punches.map(p => p.tia))];
        window._currentPunchesData = punches;
        const operatorOptions = uniqueTias.map(t => {
           const u = getUserByTia(t);
           const name = u ? u.fullName : t;
           const selected = AppState.punchesFilters.operatorTia === t ? 'selected' : '';
           return `<option value="${t}" ${selected}>${name} (${t})</option>`;
        }).join('');

        filtersHtml = `
          <div class="bg-aero-card border border-aero-border rounded-xl p-4 mb-4 flex flex-col shadow-sm">
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full">
              <div class="w-full sm:w-1/2">
                <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Filtra per Operatore</label>
                <select onchange="AppState.punchesFilters.operatorTia = this.value; renderApp();" class="w-full bg-[#0d1721] border border-aero-border rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                  <option value="ALL" ${AppState.punchesFilters.operatorTia === 'ALL' ? 'selected' : ''}>Tutti gli Operatori</option>
                  ${operatorOptions}
                </select>
              </div>
              <div class="w-full sm:w-1/2">
                <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Periodo di Riferimento</label>
                <select onchange="window.handleDateRangeChange(this.value)" class="w-full bg-[#0d1721] border border-aero-border rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                  <option value="ALL" ${AppState.punchesFilters.dateRange === 'ALL' ? 'selected' : ''}>Tutto lo storico</option>
                  <option value="TODAY" ${AppState.punchesFilters.dateRange === 'TODAY' ? 'selected' : ''}>Oggi</option>
                  <option value="LAST_7" ${AppState.punchesFilters.dateRange === 'LAST_7' ? 'selected' : ''}>Ultimi 7 giorni</option>
                  <option value="THIS_MONTH" ${AppState.punchesFilters.dateRange === 'THIS_MONTH' ? 'selected' : ''}>Mese corrente</option>
                  <option value="CUSTOM" ${AppState.punchesFilters.dateRange === 'CUSTOM' ? 'selected' : ''}>Intervallo Personalizzato (Dal / Al)...</option>
                </select>
              </div>
            </div>
            ${AppState.punchesFilters.dateRange === 'CUSTOM' && AppState.punchesFilters.customStartDate ? `
                <div class="inline-flex items-center gap-2 py-1 px-3 w-fit text-xs rounded-full bg-indigo-950/60 border border-indigo-500/30 text-indigo-200 mt-3">
                  <span>Periodo: ${AppState.punchesFilters.customStartDate} - ${AppState.punchesFilters.customEndDate}</span>
                  <button type="button" onclick="AppState.punchesFilters.dateRange = 'ALL'; renderApp();" class="text-indigo-400 hover:text-white cursor-pointer flex items-center">${Icons.x}</button>
                </div>
            ` : ''}
            
            <div class="grid grid-cols-2 gap-3 w-full mt-3">
              <div class="bg-[#0d1721] px-4 py-2 rounded-lg border border-aero-border text-center">
                <div class="text-[10px] text-slate-400 uppercase font-bold mb-0.5">Totale Ore Lavorate</div>
                <div class="text-lg font-bold font-mono text-sky-400">${totalWorkedDisplay}</div>
              </div>
              <div class="bg-[#0d1721] px-4 py-2 rounded-lg border border-aero-border text-center">
                <div class="text-[10px] text-indigo-400 uppercase font-bold mb-0.5">Di Cui Ore Notturno</div>
                <div class="text-lg font-bold font-mono text-indigo-400">${totalNightDisplay}</div>
              </div>
            </div>
          </div>
        `;

        // Anomalies & Pending Reconciliations Panel
        if (user.role === 'ADMIN') {
          anomaliesHtml = renderPendingReconciliationsCard(user);
        }
      } else {
        punches = AppState.punches.filter(p => p.tia === user.tia);
        const myPending = (AppState.pendingAnomalies || []).find(a => a.tia === user.tia);
        if (myPending) {
          if (myPending.status === 'IN_ATTESA_APPROVAZIONE_ADMIN') {
            anomaliesHtml = `
              <div class="mb-6 p-4 rounded-xl bg-amber-950/40 border border-amber-500/40 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs text-amber-200 animate-fade-in">
                <div class="flex items-center space-x-3">
                  <span class="text-xl">⏳</span>
                  <div>
                    <div class="font-bold text-amber-300">Richiesta Riconciliazione in Attesa di Approvazione Admin</div>
                    <div class="text-[11px] text-amber-400/80">
                      Turno del ${myPending.date} (${myPending.shiftStart}) &bull; Uscita richiesta: <strong class="text-white">${myPending.requestedShiftEnd}</strong> &bull; Inviata alle ${myPending.submissionTime || '--:--'}
                    </div>
                  </div>
                </div>
                <span class="px-2.5 py-1 rounded bg-amber-500/20 text-amber-300 font-mono text-[10px] font-bold border border-amber-500/30 shrink-0">
                  In Verifica Operativa Admin
                </span>
              </div>
            `;
          } else {
            anomaliesHtml = `
              <div class="mb-6 p-4 rounded-xl bg-amber-950/70 border border-amber-500/60 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs text-amber-200 animate-pulse">
                <div class="flex items-center space-x-3">
                  <span class="text-xl">⚠️</span>
                  <div>
                    <div class="font-bold text-white">Turno Interrotto Automaticamente (>10h) da Riconciliare</div>
                    <div class="text-[11px] text-amber-300">
                      Il turno del ${myPending.date} (${myPending.shiftStart}) ha superato il limite massimo di 10 ore. Invia subito la richiesta di rettifica all'Admin.
                    </div>
                  </div>
                </div>
                <button type="button" onclick="ModalManager.openReconciliationModal('${myPending.punchId}')" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold rounded-xl text-xs transition shadow-md shadow-amber-900/40 cursor-pointer shrink-0">
                  Invia Richiesta all'Admin
                </button>
              </div>
            `;
          }
        }
      }

      return `
        <div class="space-y-6 pb-6 sm:pb-8 animate-fade-in">
          ${anomaliesHtml}
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-bold text-white">Registro Presenze & Timbrature</h2>
              <p class="text-xs text-slate-400">${user.role === 'ADMIN' ? 'Storico globale delle timbrature e monitoraggio ore lavorate.' : 'Storico personale degli orari di inizio turno, pause e fine turno.'}</p>
            </div>
            ${user.role === 'ADMIN' ? `
              <button type="button" onclick="window.exportPunchesCsv()" class="p-2.5 rounded-lg bg-emerald-950/60 border border-emerald-500/30 text-emerald-300 hover:bg-emerald-900/60 transition shadow-sm cursor-pointer" title="Esporta Registro Excel / CSV">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              </button>
            ` : ''}
          </div>
          ${filtersHtml}
          <div class="bg-aero-card border border-aero-border rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-[#0d1721] text-slate-400 border-b border-aero-border font-mono uppercase text-[10px]">
                  <tr>
                    <th class="p-3.5">ID / Data</th>
                    ${user.role === 'ADMIN' ? '<th class="p-3.5">Operatore (TIA)</th>' : ''}
                    <th class="p-3.5">Inizio Turno</th>
                    <th class="p-3.5">Pausa Fruita</th>
                    <th class="p-3.5">Fine Turno</th>
                    <th class="p-3.5">Ore Lavorate</th>
                    <th class="p-3.5">Stato & Esito</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-aero-border">
                  ${punches.length === 0 ? `
                    <tr>
                      <td colspan="${user.role === 'ADMIN' ? '7' : '6'}" class="p-6 text-center text-slate-400 italic">
                        Nessuna timbratura trovata per i criteri selezionati.
                      </td>
                    </tr>
                  ` : ''}
                  ${punches.map(p => {
                    const u = getUserByTia(p.tia) || { fullName: 'Sconosciuto' };
                    return `
                      <tr class="hover:bg-slate-900/40 transition">
                        <td class="p-3.5">
                          <div class="font-mono text-white font-bold">${p.date}</div>
                          <div class="text-[10px] text-slate-500 font-mono">${p.id}</div>
                        </td>
                        ${user.role === 'ADMIN' ? `
                        <td class="p-3.5">
                          <button type="button" onclick="ModalManager.openOperatorModal('${p.tia}')" class="text-left group cursor-pointer inline-block" title="Visualizza Scheda Operatore">
                            <div class="font-bold text-sky-400 group-hover:text-sky-300 group-hover:underline">${u.fullName}</div>
                            <div class="font-mono text-[10px] text-slate-400">${p.tia}</div>
                          </button>
                        </td>
                        ` : ''}
                        <td class="p-3.5 font-mono text-slate-200">${p.shiftStart}</td>
                        <td class="p-3.5">
                          <div class="font-mono text-slate-200">${p.pauseStart || '--:--'} - ${p.pauseEnd || '--:--'}</div>
                          <div class="text-[10px] text-slate-400">${p.pauseDurationMinutes ? p.pauseDurationMinutes + ' min' : 'Nessuna'}</div>
                        </td>
                        <td class="p-3.5 font-mono text-slate-200">${p.shiftEnd || 'In corso'}</td>
                        <td class="p-3.5 font-bold">
                          <div class="font-mono text-sky-400">${p._computedWorked || p.workedHours || 'In calcolo'}</div>
                          ${(p._computedNight && p._computedNight !== '0h 0m') ? `<div class="font-mono text-[10px] text-indigo-400 mt-0.5">Notturno: ${p._computedNight}</div>` : ''}
                        </td>
                        <td class="p-3.5">
                          <div class="flex flex-col space-y-1">
                            <div>
                              ${p.status === 'COMPLETATO' ? `
                                <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                                  ${p.status}
                                </span>
                              ` : p.status === 'CONCILIATO E APPROVATO' ? `
                                <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 inline-flex items-center space-x-1">
                                  <span>✅</span>
                                  <span>CONCILIATO E APPROVATO</span>
                                </span>
                              ` : p.status === 'IN_ATTESA_APPROVAZIONE_ADMIN' ? `
                                <div class="space-y-0.5">
                                  <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 inline-flex items-center space-x-1">
                                    <span>⏳</span>
                                    <span>IN ATTESA APPROVAZIONE ADMIN</span>
                                  </span>
                                  ${p.requestedShiftEnd ? `<div class="text-[10px] text-amber-300 font-mono">Uscita richiesta: <strong>${p.requestedShiftEnd}</strong></div>` : ''}
                                </div>
                              ` : p.status === 'FALSA TIMBRATURA / ANOMALIA NON GIUSTIFICATA' ? `
                                <div class="space-y-1">
                                  <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-rose-500/20 text-rose-400 border border-rose-500/40 inline-flex items-center space-x-1">
                                    <span>❌</span>
                                    <span>FALSA TIMBRATURA</span>
                                  </span>
                                  <div class="text-[10px] text-rose-300/90 italic bg-rose-950/40 p-1.5 rounded border border-rose-500/30">
                                    <strong>Nota Admin:</strong> "${escapeHtml(p.adminRejectionReason || 'Contestazione d\'ufficio')}"
                                  </div>
                                </div>
                              ` : p.status.includes('ANOMALIA') || p.status.includes('CHIUSO') ? `
                                <div class="space-y-1">
                                  <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">
                                    ⚠️ SFORAMENTO >10H
                                  </span>
                                  <div>
                                    <button type="button" onclick="ModalManager.openReconciliationModal('${p.id}')" class="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded text-[10px] font-bold shadow-sm transition cursor-pointer">
                                      Invia Richiesta all'Admin
                                    </button>
                                  </div>
                                </div>
                              ` : `
                                <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-sky-500/20 text-sky-400">
                                  ${p.status}
                                </span>
                              `}

    window.handleLoginSubmit = (e) => {
      e.preventDefault();
      const tiaInput = document.getElementById('login-tia');
      const pwdInput = document.getElementById('login-password');
      const errDiv = document.getElementById('login-error');
      if (!tiaInput || !pwdInput) return;

      const rawTia = tiaInput.value.trim();
      const pwd = pwdInput.value;

      if (!rawTia) {
        if (errDiv) {
          errDiv.innerHTML = "Inserire il Numero TIA";
          errDiv.className = "p-3 rounded-xl bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs font-medium";
          errDiv.classList.remove('hidden');
        }
        return;
      }

      // Normalizzazione automatica: riconosce e valida sia "11509" che "TIA-11509"
      const matchedUser = findUserByTiaOrNumber(rawTia);
      if (matchedUser && matchedUser.password === pwd) {
        if (matchedUser.status === 'PENDING_APPROVAL') {
          if (errDiv) {
            errDiv.innerHTML = `
              <div class="flex items-center space-x-2">
                <span class="text-base">⏳</span>
                <span>Account in attesa di approvazione da parte dell'Admin.</span>
              </div>

            errDiv.className = "p-3 rounded-xl bg-amber-950/80 border border-amber-500/60 text-amber-200 text-xs font-medium";
            errDiv.classList.remove('hidden');
          }
          showToast("Account in attesa di approvazione da parte dell'Admin.", "error");
          return;
        }

        // Connessione sessione Firebase Auth in background
        if (window.FirebaseBridge && typeof window.FirebaseBridge.firebaseLoginWithCredentials === 'function') {
          window.FirebaseBridge.firebaseLoginWithCredentials(rawTia, pwd).then(res => {
            if (res && res.success) console.log('[FIREBASE] Autenticazione Firebase confermata per', rawTia);
          }).catch(err => console.warn('[FIREBASE] Avviso auth:', err));
        }

        AppState.isAuthenticated = true;
        AppState.currentTia = matchedUser.tia;
        AppState.activeTab = 'home';
        AppState.isSidebarOpen = false;
        ModalManager.close();
        window.closeNavDrawer();
        window.closeSidebarProfilePanel();
        const profileDropdown = document.getElementById('profile-dropdown');
        if (profileDropdown) profileDropdown.classList.add('hidden');
        const notifDropdown = document.getElementById('notifications-dropdown');
        if (notifDropdown) notifDropdown.classList.add('hidden');
        safeSetItem(DB_KEYS.AUTH, 'true');
        safeSetItem(DB_KEYS.CURRENT_TIA, matchedUser.tia);
        initActiveShift();
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (typeof window.checkAndShowTutorialOnboarding === 'function') {
          window.checkAndShowTutorialOnboarding();
        }
      } else {
        if (errDiv) {
          errDiv.innerHTML = "Credenziali non valide o utente non autorizzato";
          errDiv.className = "p-3 rounded-xl bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs font-medium";
          errDiv.classList.remove('hidden');
        }
        showToast("Credenziali non valide o utente non autorizzato", "error");
      }

      if (window.visualViewport) {
        const header = document.querySelector('header');
        const headerH = header ? header.offsetHeight : 88;
        const offset = window.innerWidth < 640 ? 0 : 8;
        const availableHeight = Math.floor(window.visualViewport.height - headerH - offset);
        if (availableHeight > 180) {
          rootContainer.style.height = `${availableHeight}px`;
          rootContainer.style.maxHeight = `${availableHeight}px`;
        }
      }
      scrollAiChatToBottom();
    }

          ModalManager.openTutorialModal();
        }, 400);
      }
    };

    // Header Profile Dropdown & Switch Account Handlers
    window.closeProfileDropdown = () => {
      const dropdown = document.getElementById('profile-dropdown');
      if (dropdown) dropdown.classList.add('hidden');
    };
    window.toggleProfileDropdown = (event) => {
      if (event) event.stopPropagation();
      const dropdown = document.getElementById('profile-dropdown');
      if (dropdown) {
        dropdown.classList.toggle('hidden');
      }
    };

    window.openMyProfileModal = () => {
      const dropdown = document.getElementById('profile-dropdown');
      if (dropdown) dropdown.classList.add('hidden');
      const user = getCurrentUser();
      ModalManager.openOperatorModal(user.tia);
    };

    window.openPersonnelModalFromDropdown = () => {
      const dropdown = document.getElementById('profile-dropdown');
      if (dropdown) dropdown.classList.add('hidden');
      const user = getCurrentUser();
      if (!canAccessPersonnelConsole(user)) {
        showToast("Accesso riservato a Supervisori, Coordinatori e Amministratori (Livello 2+).", "error");
        return;
      }
      ModalManager.openPersonnelModal();
    };

    window.openSwitchAccountModal = () => {
      const dropdown = document.getElementById('profile-dropdown');
      if (dropdown) dropdown.classList.add('hidden');
      ModalManager.openSwitchAccountModal();
    };

    window.switchTestAccount = (tia) => {
      ModalManager.close();
      window.closeNavDrawer();
      window.closeSidebarProfilePanel();
      const profileDropdown = document.getElementById('profile-dropdown');
      if (profileDropdown) profileDropdown.classList.add('hidden');
      const notifDropdown = document.getElementById('notifications-dropdown');
      if (notifDropdown) notifDropdown.classList.add('hidden');

      const matchedUser = AppState.users.find(u => u.tia === tia);
      if (matchedUser) {
        if (matchedUser.status === 'PENDING_APPROVAL') {
          showToast("Account in attesa di approvazione da parte dell'Admin.", "error");
          return;
        }
        AppState.currentTia = matchedUser.tia;
        AppState.activeTab = 'home';
        AppState.isSidebarOpen = false;
        safeSetItem(DB_KEYS.CURRENT_TIA, matchedUser.tia);
        initActiveShift();
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast(`Profilo attivo: ${matchedUser.fullName} (${matchedUser.tia}) &mdash; Vista reimpostata su Home`, "info");
      }
    };

    document.addEventListener('click', (e) => {
      const container = document.getElementById('notifications-dropdown-container');
      const dropdown = document.getElementById('notifications-dropdown');
      if (dropdown && !dropdown.classList.contains('hidden')) {
        if (container && !container.contains(e.target)) {
          dropdown.classList.add('hidden');
        }
      }
    });

    window.handlePwaInstallClick = () => {
      if (AppState.pwaDeferredPrompt) {
        AppState.pwaDeferredPrompt.prompt();
        AppState.pwaDeferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            safeSetItem('SAC_PWA_INSTALLED_V3', 'true');
          }
          AppState.pwaDeferredPrompt = null;
          renderApp();
        });
      } else {
        // Show iOS / Browser instruction modal
        ModalManager.openIOSInstallGuide();
      }
    };

    // Capture PWA Install Prompt (nuovo ID /SAC-Desk/app-v3 forza nuova generazione WebAPK pulita)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      safeSetItem('SAC_PWA_INSTALLED_V3', 'false');
      AppState.pwaDeferredPrompt = e;
      renderApp();
    });

    // When app is installed, dismiss install button permanently
    window.addEventListener('appinstalled', () => {
      AppState.pwaDeferredPrompt = null;
      safeSetItem('SAC_PWA_INSTALLED_V3', 'true');
      renderApp();
    });

    // Online / Offline monitor
    window.addEventListener('online', () => { AppState.isOnline = true; renderApp(); });
    window.addEventListener('offline', () => { AppState.isOnline = false; renderApp(); });

    // Non-blocking Live Clock (Direct DOM updates, avoids wiping active inputs)
    setInterval(() => {
      const localEl = document.getElementById('live-local-clock');
      const zuluEl = document.getElementById('live-zulu-clock');
      if (localEl || zuluEl) {
        const now = new Date();
        if (localEl) localEl.innerText = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if (zuluEl) zuluEl.innerText = now.toISOString().slice(11, 19) + ' Z';
      }
      const pauseCounterEl = document.getElementById('live-pause-counter');
      if (pauseCounterEl && AppState.activeShift && AppState.activeShift.pauseTimestamp) {
        const mins = Math.max(0, Math.floor((Date.now() - AppState.activeShift.pauseTimestamp) / 60000));
        pauseCounterEl.innerText = `${mins} min`;
      }
      const shiftElapsedEl = document.getElementById('live-shift-elapsed');
      if (shiftElapsedEl && AppState.activeShift) {
        let startMs = AppState.activeShift.startTimestamp;
        if (!startMs && AppState.activeShift.shiftStart) {
          const parts = AppState.activeShift.shiftStart.split(':').map(Number);
          if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            const d = new Date();
            d.setHours(parts[0], parts[1], 0, 0);
            startMs = d.getTime();
          }
        }
        if (startMs) {
          const totalMs = Math.max(0, Date.now() - startMs);
          const hrs = Math.floor(totalMs / 3600000);
          const mins = Math.floor((totalMs % 3600000) / 60000);
          shiftElapsedEl.innerText = `${hrs}h ${mins < 10 ? '0' : ''}${mins}m`;
        }
      }
    }, 1000);

    // Global Escape key listener to close modals without navigation or reloads
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ModalManager.close();
      }
    });

    // Initial render: immediate + 300ms fallback guarantee
    try {
      renderApp();
      checkAntiSpoofing();
    } catch(err) {
      console.warn("Initial mount attempt:", err);
    }
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
      if (typeof window.checkAndShowTutorialOnboarding === 'function') {
        window.checkAndShowTutorialOnboarding();
      }
    });
    setTimeout(() => {
      if (!window.__appMounted) {
        renderApp();
      }
      if (typeof window.checkAndShowTutorialOnboarding === 'function') {
        window.checkAndShowTutorialOnboarding();
      }
    }, 300);

    // Dynamic background sync with Google Drive Security Archive
    setTimeout(() => {
      syncDriveArchive(false);
    }, 600);
  </script>




</body>
</html>
