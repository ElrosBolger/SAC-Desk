  <!-- PWA Embedded Aviation Icon Fallback & Service Worker Registration -->
  <script>
    (function initPwaIconsAndSw() {
      // Generatore nativo embedded dello stemma azzurro aviazione S.A.C. Desk (192x192 / 512x512)
      function drawSacEmblemPng(size) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          if (!ctx) return null;

          // Sfondo istituzionale #0f172a (safe-zone any maskable)
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, size, size);

          const scale = (size / 512) * 0.82;
          const offset = (size * (1 - 0.82)) / 2;

          ctx.save();
          ctx.translate(offset, offset);
          ctx.scale(scale, scale);

          // Anello esterno luminoso
          ctx.beginPath();
          ctx.arc(256, 256, 242, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.28)';
          ctx.fill();

          // Clip circolare stemma aviazione
          ctx.beginPath();
          ctx.arc(256, 256, 236, 0, Math.PI * 2);
          ctx.clip();

          // Cielo azzurro aviazione
          ctx.fillStyle = '#24a8e0';
          ctx.fillRect(0, 0, 512, 512);

          // Onda blu navy inferiore
          const navyWave = new Path2D('M 50 330 C 130 380, 200 440, 290 445 C 360 450, 410 415, 460 350 L 512 512 L 0 512 Z');
          ctx.fillStyle = '#1b287d';
          ctx.fill(navyWave);

          // Silhouette velivolo e scia aerodinamica bianca
          const planePath = new Path2D('M 64 345 C 118 375, 178 372, 230 350 C 270 332, 295 315, 310 295 L 346 398 C 353 410, 368 402, 362 390 L 348 285 L 426 182 C 434 172, 428 162, 416 166 L 326 250 L 182 232 C 170 230, 168 244, 178 250 L 278 288 C 230 330, 150 366, 64 345 Z');
          ctx.fillStyle = '#ffffff';
          ctx.fill(planePath);

          ctx.restore();
          return canvas.toDataURL('image/png');
        } catch (e) {
          return null;
        }
      }
      window.generateEmbeddedSacIcon = drawSacEmblemPng;

      // Verifica non bloccante icone/manifest statici con fallback embedded automatico
      window.addEventListener('DOMContentLoaded', () => {
        fetch('./icon-192.png', { method: 'HEAD' })
          .then((res) => {
            if (!res.ok) throw new Error('Icon 404');
          })
          .catch(() => {
            const icon192 = drawSacEmblemPng(192);
            const icon512 = drawSacEmblemPng(512);
            const icon180 = drawSacEmblemPng(180);
            if (icon192) {
              const l192 = document.getElementById('pwa-png-192');
              if (l192) l192.href = icon192;
            }
            if (icon512) {
              const l512 = document.getElementById('pwa-png-512');
              if (l512) l512.href = icon512;
            }
            if (icon180) {
              const a1 = document.getElementById('pwa-apple-icon-180');
              const a2 = document.getElementById('pwa-apple-icon');
              if (a1) a1.href = icon180;
              if (a2) a2.href = icon180;
            }
            // Se anche manifest.json non fosse raggiungibile, genera manifest embedded di emergenza
            fetch('./manifest.json', { method: 'HEAD' })
              .then((mRes) => {
                if (!mRes.ok) throw new Error('Manifest 404');
              })
              .catch(() => {
                if (icon192 && icon512) {
                  const fallbackManifest = {
                    id: '/SAC-Desk/app-v3',
                    name: 'S.A.C. Desk - Airport Security',
                    short_name: 'SAC Desk',
                    start_url: new URL('./index.html?v=3', window.location.href).href,
                    scope: new URL('./', window.location.href).href,
                    display: 'standalone',
                    background_color: '#0f172a',
                    theme_color: '#0f172a',
                    icons: [
                      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
                      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
                      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
                      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
                    ]
                  };
                  const blob = new Blob([JSON.stringify(fallbackManifest)], { type: 'application/manifest+json' });
                  const mLink = document.getElementById('pwa-manifest-link');
                  if (mLink) mLink.href = URL.createObjectURL(blob);
                }
              });
          });
      });

      // Pulizia preventiva client-side delle cache precedenti a sac-desk-pwa-v5
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key.startsWith('sac-desk-pwa') && key !== 'sac-desk-pwa-v5') {
              caches.delete(key);
            }
          });
        }).catch(() => {});
      }

      // Force Unregister di tutti i Service Worker esistenti sul dominio prima di registrare il nuovo ./sw.js (v5)
      if ('serviceWorker' in navigator) {
        const registerFreshServiceWorker = () => {
          navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
            .then((registration) => {
              console.log('S.A.C. Desk PWA Service Worker v5 registrato con successo, scope:', registration.scope);

              registration.update().catch(() => {});

              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }

              registration.addEventListener('updatefound', () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.addEventListener('statechange', () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('Nuova versione S.A.C. Desk v5 pronta: attivazione immediata.');
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch((err) => {
              console.warn('Avviso registrazione Service Worker S.A.C. Desk:', err);
            });
        };

        window.addEventListener('load', () => {
          if (navigator.onLine === false) {
            registerFreshServiceWorker();
            return;
          }
          navigator.serviceWorker.getRegistrations()
            .then(function(registrations) {
              const unregisterPromises = [];
              for (let registration of registrations) {
                unregisterPromises.push(registration.unregister());
              }
              return Promise.allSettled(unregisterPromises);
            })
            .then(() => {
              registerFreshServiceWorker();
            })
            .catch(() => {
              registerFreshServiceWorker();
            });
        });
      }
    })();
  </script>

    /* -------------------------------------------------------------
       GLOBAL NOTIFICATIONS & TOAST SYSTEM (BOTTOM POSITIONED & AUTO-CLOSE)
    ------------------------------------------------------------- */
    function showToast(message, type = 'info') {
      const toastId = 'toast-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
      const isError = type === 'error';
      const bg = isError ? 'bg-rose-900/95 border-rose-500/60 text-white' : 'bg-[#0b1726]/95 border-sky-500/60 text-sky-100';
      const icon = isError 
        ? '<span class="text-rose-400 font-bold">⚠️</span>' 
        : '<span class="text-sky-400 font-bold">ℹ️</span>';

      // Posizionamento esatto: position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 9999;
      const html = `
        <div 
          id="${toastId}" 
          style="position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: min(520px, calc(100vw - 32px)); width: max-content;"
          class="px-4 py-3 rounded-2xl ${bg} border backdrop-blur-md shadow-2xl flex items-center space-x-3 animate-fade-in pointer-events-auto transition-all duration-300"
          role="status"
        >
          <div class="shrink-0 flex items-center justify-center">${icon}</div>
          <span class="text-xs font-semibold leading-snug flex-1">${message}</span>
          <button 
            type="button" 
            onclick="removeToast('${toastId}')" 
            class="ml-2 text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/10 transition cursor-pointer shrink-0"
            title="Chiudi notifica"
            aria-label="Chiudi notifica"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      `;
      const div = document.createElement('div');
      div.id = 'wrapper-' + toastId;
      div.innerHTML = html;
      const target = document.body || document.documentElement;
      if (target) {
        target.appendChild(div);
      }

      // Chiusura automatica dopo 4 secondi (4000ms) per tutte le notifiche
      setTimeout(() => {
        removeToast(toastId);
      }, 4000);

      return toastId;
    }
    window.showToast = showToast;

    function removeToast(id) {
      const el = document.getElementById(id);
      if (el) {
        el.style.opacity = '0';
        el.style.transform = 'translateX(-50%) translateY(12px)';
        setTimeout(() => {
          if (el.parentNode && el.parentNode.id === 'wrapper-' + id) {
            el.parentNode.remove();
          } else {
            el.remove();
          }
        }, 220);
      }
      const wrap = document.getElementById('wrapper-' + id);
      if (wrap) wrap.remove();
    }
    window.removeToast = removeToast;

    /* -------------------------------------------------------------
       SAFE STORAGE ENGINE WITH IN-MEMORY FALLBACK (SANDBOX / IFRAME SAFE)
    ------------------------------------------------------------- */
    const memoryStore = {};
    function safeGetItem(key) {
      try {
        if (window.localStorage) {
          return window.localStorage.getItem(key);
        }
      } catch (e) {
        // Fall through to memoryStore
      }
      return memoryStore[key] || null;
    }

    function safeSetItem(key, val) {
      try {
        if (window.localStorage) {
          window.localStorage.setItem(key, val);
        }
      } catch (e) {
        // Safe fallback
      }
      memoryStore[key] = val;
    }


    /* -------------------------------------------------------------
       ANTI-SPOOFING & VPN DETECTION
    ------------------------------------------------------------- */
    function showVpnBlockModal() {
       const html = `
        <div class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-xl">
          <div class="bg-[#0d1721] border border-rose-500/50 rounded-2xl shadow-2xl max-w-lg w-full p-8 space-y-6 text-center">

              <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight uppercase">Accesso Negato</h2>
            <p class="text-slate-300 leading-relaxed text-sm">
              Rilevata connessione anonima o VPN attiva. Per garantire la certificazione delle timbrature e la conformità di sicurezza, disattiva la VPN per utilizzare S.A.C. Desk.
            </p>
          </div>
        </div>
       `;
       const div = document.createElement('div');
       div.innerHTML = html;
       document.body.appendChild(div);
    }

    async function checkAntiSpoofing() {
      try {
        const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (localTz !== 'Europe/Rome') {
          showVpnBlockModal();
          return;
        }
        
        // Optional: call IP check. To avoid CORS blocks or rate limits, we use ipapi.co (or timezone mismatch fallback)
        const resp = await fetch('https://ipapi.co/json/').catch(() => null);
        if (resp) {
          const data = await resp.json();
          if (data.country !== 'IT' || (data.security && data.security.vpn)) {
             showVpnBlockModal();
          }
        }
      } catch(e) {
        // Silent fail for network errors
      }
    }
    window.checkAntiSpoofing = checkAntiSpoofing;

    // =============================================================
    // LIVELLO 1 • OPERATORE: Home, Timbrature, Segnalazioni, Documenti, ARGOS. No Console Anagrafica.
    // LIVELLO 2 • SUPERVISORE (SOLA LETTURA): Accesso Console Anagrafica in sola lettura. Nessun comando di modifica.
    // LIVELLO 3 • COORDINATORE (TITOLI & CERTIFICAZIONI): Mansioni presidio (RX, CRU, Capoturno), Certificazioni ENAC A1-A6.
    // LIVELLO 4 • ADMIN / SUPERADMIN (VINCENZO BELLINI): Controllo totale (A11, A12, A12bis, Decreti, eliminazione profili).
    function getUserSecurityLevel(user) {
      if (!user) return 1;
      if (isSuperAdmin(user) || user.tia === 'TIA-90001' || user.isSuperAdmin === true || user.role === 'SUPERADMIN') {
        return 4;
      }
      const duties = getUserDuties(user);
      const qual = (user.qualification || '').toUpperCase();
      const role = (user.role || '').toUpperCase();

      // LIVELLO 4 • ADMIN / SUPERADMIN
      if (role === 'ADMIN' || duties.includes('DUTY_MANAGER') || qual.includes('SECURITY MANAGER') || qual.includes('ADMIN')) {
        return 4;
      }
      // LIVELLO 3 • COORDINATORE (Gestione Titoli & Certificazioni)
      if (role === 'COORDINATORE' || role === 'COORDINATOR' || duties.includes('DUTY_COORDINATORE') || 
          (Array.isArray(user.coordinatorDelegations) && user.coordinatorDelegations.length > 0) || 
          qual.includes('COORDINATORE') || qual.includes('COORDINATOR')) {
        return 3;
      }
      // LIVELLO 2 • SUPERVISORE (Sola Lettura)
      if (role === 'SUPERVISORE' || role === 'SUPERVISOR' || 
          duties.includes('DUTY_SUPERVISOR') || duties.includes('DUTY_CAPOTURNO') || 
          qual.includes('SUPERVISOR') || qual.includes('SUPERVISORE') || qual.includes('CAPOTURNO')) {
        return 2;
      }
      // LIVELLO 1 • OPERATORE
      return 1;
    }

    function getUserDuties(user) {
      if (!user) return ['DUTY_RX'];

      const duties = [];

      if (qual.includes('RX') || qual.includes('RADIOGENO') || qual.includes('BAGAGLI') || qual.includes('VARCHI')) {
        duties.push('DUTY_RX');

        }
        const d = new Date(dateStr);
        return isNaN(d.getTime()) ? String(dateStr) : d.toLocaleDateString('it-IT');
      } catch(e) {
        return String(dateStr);
      }
    }

    // Recursive Tree Parser converts Google Apps Script JSON into flat VFS nodes
    function parseAppsScriptTree(root) {
      if (!root) return [];
      const nodes = [];

      function traverse(folder, parentId = null, pathName = "") {
        if (!folder) return;
        const isRootWrapper = (parentId === null && (folder.name === "freesat" || folder.name === "root" || !folder.name));
        const currentPath = isRootWrapper ? "" : (pathName ? pathName + "/" + folder.name : folder.name);
        const folderId = isRootWrapper ? null : ("fld-" + currentPath.replace(/[^a-zA-Z0-9_-]/g, "_"));

        if (!isRootWrapper) {
          const subCount = (folder.subfolders ? folder.subfolders.length : 0) + (folder.files ? folder.files.length : 0);
          nodes.push({
            id: folderId,
            parentId: parentId,
            type: "folder",
            name: folder.name,
            path: currentPath,
            itemsCount: subCount
          });
        }

        if (folder.subfolders && Array.isArray(folder.subfolders)) {
          folder.subfolders.forEach(sub => traverse(sub, isRootWrapper ? null : folderId, currentPath));
        }

        if (folder.files && Array.isArray(folder.files)) {
          folder.files.forEach(f => {
            const fileId = f.id || "";
            nodes.push({
              id: fileId || ("fil-" + (f.name || "").replace(/[^a-zA-Z0-9_-]/g, "_")),
              parentId: isRootWrapper ? null : folderId,
              type: "file",
              name: f.name || "Documento PDF",
              code: (f.name || "").replace(/\.pdf$/i, ""),
              classification: "TOP SECRET",
              summary: `Documento operativo sincronizzato da Google Drive Security (${f.name}).`,
              fileId: fileId,
              url: f.url || (fileId ? `https://drive.google.com/file/d/${fileId}/view` : ""),
              fullText: `Documento Operativo S.A.C.: ${f.name}. File ID Google Drive: ${fileId}. Anteprima protetta.`
            });
          });
        }
      }

      traverse(root, null, "");
      return nodes;
    }

        } catch (e) {
          console.warn("Parsing albero salvato fallito:", e);

        // 2. Fallback trasparente su proxy server locale se presente

    function getShiftMetrics(p) {
      if (!p.shiftStart || !p.shiftEnd || p.shiftEnd === "AUTO") {
         return { worked: 0, night: 0, displayWorked: p.workedHours || "N/D", displayNight: "0h 0m" };
      }
      const parseTime = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
      let start = parseTime(p.shiftStart);
      let end = parseTime(p.shiftEnd);
      if (end < start) end += 1440; 
      
      let worked = Math.max(0, end - start);
      
      const overlap = (s1, e1, s2, e2) => Math.max(0, Math.min(e1, e2) - Math.max(s1, s2));
      const getNightOverlap = (s, e) => {
        return overlap(s, e, 0, 480) + overlap(s, e, 1200, 1920) + overlap(s, e, 2640, 3360);
      };
      
      let night = getNightOverlap(start, end);
      
      if (p.pauseStart && p.pauseEnd) {
        let ps = parseTime(p.pauseStart);
        let pe = parseTime(p.pauseEnd);
        if (ps < start) ps += 1440;
        if (pe < ps) pe += 1440;
        
        if (ps >= start && pe <= end) {
          worked -= Math.max(0, pe - ps);
          night -= getNightOverlap(ps, pe);
        }
      }
      
      worked = Math.max(0, worked);
      night = Math.max(0, night);
      
      return {
        worked, night,
        displayWorked: `${Math.floor(worked/60)}h ${worked%60}m`,
        displayNight: `${Math.floor(night/60)}h ${night%60}m`
      };
    }

    // =============================================================
    const OfflineSyncEngine = {
      queueKey: 'SAC_OFFLINE_SYNC_QUEUE_V1',
      getQueue() {
        return getStored(this.queueKey, []);
      },
      enqueue(action, payload) {
        try {
          const queue = this.getQueue();
          queue.push({
            id: 'SYNC-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
            action,
            payload,
            timestamp: new Date().toISOString(),
            tia: (AppState && AppState.currentTia) ? AppState.currentTia : 'TIA-90001'
          });
          setStored(this.queueKey, queue);
          this.triggerSync();
        } catch (e) {
          console.warn('[OFFLINE-SYNC] Enqueue error:', e);
        }
      },
      async triggerSync() {
        if (!navigator.onLine) {
          if (AppState) AppState.syncStatus = 'OFFLINE';
          renderApp();
          return;
        }
        const queue = this.getQueue();
        if (queue.length === 0) {
          if (AppState) AppState.syncStatus = 'SYNCED';
          return;
        }
        if (AppState) AppState.syncStatus = 'SYNCING';
        renderApp();
        try {
          const res = await fetch('/api/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ batch: queue, currentTia: AppState.currentTia })
          });
          if (res.ok) {
            setStored(this.queueKey, []);
            if (AppState) {
              AppState.syncStatus = 'SYNCED';
              AppState.lastCloudSync = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
            }
          } else {
            if (AppState) AppState.syncStatus = 'PENDING';
          }
        } catch (e) {
          if (AppState) AppState.syncStatus = 'PENDING';
        }
        renderApp();
      }
    };
    window.OfflineSyncEngine = OfflineSyncEngine;

          timeFormatted: n.timeFormatted || 'Oggi',
          actionType: n.actionType || null,
          actionPayload: n.actionPayload || null,
          actionLabel: n.actionLabel || null,
          read: !!n.read || readIds.includes(n.id)
        });
      });

      const scoreMap = { CRITICAL: 4, HIGH: 3, WARNING: 2, INFO: 1 };
      notifs.sort((a, b) => {
        if (a.read !== b.read) return a.read ? 1 : -1;
        const diff = (scoreMap[b.severity] || 1) - (scoreMap[a.severity] || 1);
        if (diff !== 0) return diff;
        return (b.timestamp || 0) - (a.timestamp || 0);
      });

      return notifs;

      let filtered = notifs;
      if (filter === 'ALLARMI') filtered = notifs.filter(n => n.category === 'ALLARME');
      else if (filter === 'ACCREDITAMENTI') filtered = notifs.filter(n => n.category === 'ACCREDITAMENTO');
      else if (filter === 'SCADENZE') filtered = notifs.filter(n => n.category === 'SCADENZA');

        return `
          <div class="text-center py-10 px-4 space-y-2">
            <div class="w-10 h-10 rounded-full bg-slate-800/90 text-emerald-400 flex items-center justify-center mx-auto border border-slate-700/60 shadow">

            <p class="text-[11px] text-slate-400">Tutti i varchi, turni e requisiti ENAC operano regolarmente.</p>
          </div>
        `;
      }

      return filtered.map(n => {
        const isCritical = n.severity === 'CRITICAL';
        const isWarning = n.severity === 'WARNING' || n.severity === 'HIGH';
        const cardBg = isCritical 
          ? 'bg-rose-950/40 border-rose-500/50 shadow-rose-950/50' 
          : isWarning 
            ? 'bg-amber-950/30 border-amber-500/40 shadow-amber-950/40' 
            : 'bg-[#0a111a] border-aero-border/70';

          : isWarning 
            ? 'bg-amber-500/25 text-amber-300 border-amber-500/40' 
            : 'bg-sky-500/20 text-sky-300 border-sky-500/30';
        const dotColor = isCritical ? 'bg-rose-400 animate-pulse' : isWarning ? 'bg-amber-400' : 'bg-sky-400';

        return `
          <div class="p-3 rounded-xl border ${cardBg} transition duration-150 space-y-2 relative group select-none shadow-sm ${n.read ? 'opacity-70' : ''}">

                </span>
                <span class="text-[10px] text-slate-400 font-mono truncate">${n.timeFormatted}</span>
              </div>
              <button 
                type="button" 
                onclick="dismissSystemNotification('${n.id}')" 
                class="text-slate-500 hover:text-white p-1 rounded hover:bg-slate-800 transition cursor-pointer shrink-0"

              <p class="text-[11px] text-slate-300 mt-0.5 leading-relaxed">${escapeHtml(n.message)}</p>
            </div>

            ${n.actionType ? `
              <div class="pt-1.5 flex items-center justify-between border-t border-slate-700/40">
                <button 
                  type="button" 
                  onclick="handleNotificationAction('${n.actionType}', '${n.actionPayload}')" 
                  class="px-2.5 py-1 rounded-lg ${isCritical ? 'bg-rose-600 hover:bg-rose-500 text-white' : isWarning ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 font-black' : 'bg-sky-600 hover:bg-sky-500 text-white'} text-[10px] font-bold flex items-center space-x-1.5 shadow transition cursor-pointer active:scale-95"

                  <span>${n.actionLabel || 'Gestisci'}</span>
                  <span>${Icons.chevronRight}</span>
                </button>
                <span class="text-[9px] font-mono text-slate-500">Root Priority</span>

    window.toggleNotificationsDropdown = (event) => {
      if (event) event.stopPropagation();

      if (dropdown) {
        dropdown.classList.toggle('hidden');
      }

      const dropdown = document.getElementById('notifications-dropdown');
      if (dropdown) dropdown.classList.add('hidden');

      AppState.notificationsActiveFilter = filter;
      const listEl = document.getElementById('notifications-list-container');
      if (listEl) {
        const notifs = getSuperAdminNotifications();
        listEl.innerHTML = renderNotificationsList(notifs, filter);
      }
      ['ALL', 'ALLARMI', 'ACCREDITAMENTI', 'SCADENZE'].forEach(f => {
        const btn = document.getElementById(`notif-filter-btn-${f}`);

          if (f === filter) {

          }

      });

      closeNotificationsDropdown();
      if (actionType === 'APPROVE_USER') {
        ModalManager.openAdminApprovalModal(payload);
      } else if (actionType === 'VIEW_USER') {
        ModalManager.openOperatorModal(payload, false);
      } else if (actionType === 'VIEW_REPORTS') {
        switchTab('reports');
      } else if (actionType === 'VIEW_PUNCHES') {
        switchTab('punches');
      }

        saveNotifications();

      showToast("Tutti gli avvisi sono stati contrassegnati come letti.", "info");

    window.dismissSystemNotification = (id) => {
      if (!AppState.readNotificationIds) AppState.readNotificationIds = [];
      if (!AppState.readNotificationIds.includes(id)) {
        AppState.readNotificationIds.push(id);
      }
      if (AppState.notifications) {
        const n = AppState.notifications.find(x => x.id === id);
        if (n) n.read = true;
        saveNotifications();
      }
      const listEl = document.getElementById('notifications-list-container');
      if (listEl) {
        const notifs = getSuperAdminNotifications();
        listEl.innerHTML = renderNotificationsList(notifs, AppState.notificationsActiveFilter || 'ALL');

        if (unreadCount <= 0) notifBtnBadge.remove();
        else notifBtnBadge.textContent = unreadCount > 99 ? '99+' : unreadCount;

      AppState.currentTia = tia;
      safeSetItem(DB_KEYS.CURRENT_TIA, tia);
      initActiveShift();
      renderApp();
    }

    function normalizeTia(input) {
      if (!input && input !== 0) return { raw: '', digits: '', canonical: '' };
      const str = String(input).trim();
      const digits = str.replace(/\D/g, '');
      const rawUpper = str.toUpperCase();
      const canonical = digits ? `TIA-${digits}` : (rawUpper.startsWith('TIA-') ? rawUpper : `TIA-${rawUpper}`);
      return { raw: rawUpper, digits, canonical };
    }
    window.normalizeTia = normalizeTia;

    function findUserByTiaOrNumber(inputTia) {
      if (!inputTia && inputTia !== 0) return null;
      const norm = normalizeTia(inputTia);
      return AppState.users.find(u => {
        const uNorm = normalizeTia(u.tia);
        return u.tia.toUpperCase() === norm.raw ||
               u.tia.toUpperCase() === norm.canonical ||
               (norm.digits && uNorm.digits === norm.digits);
      });
    }
    window.findUserByTiaOrNumber = findUserByTiaOrNumber;

    function getCurrentUser() {
      const found = findUserByTiaOrNumber(AppState.currentTia);
      return found || AppState.users[0];
    }
    window.getCurrentUser = getCurrentUser;

    function getUserByTia(tia) {
      const found = findUserByTiaOrNumber(tia);
      if (found) return found;
      const norm = normalizeTia(tia);
      return {
        tia: norm.canonical || tia,
        fullName: "Operatore " + (norm.digits || tia),
        role: "OPERATORE",
        qualification: "Personale di Sicurezza",
        avatarColor: "from-slate-600 to-slate-800"
      };
    }
    window.getUserByTia = getUserByTia;

    window.saveNotifications = saveNotifications;
    window.saveReports = saveReports;
    window.saveDrive = saveDrive;
    window.setCurrentUser = setCurrentUser;

    // Check active shift for logged in operator
    function checkShiftAnomalies() {
      const now = Date.now();
      let changed = false;
      
      AppState.punches.forEach(p => {
        if (p.status === "IN CORSO" || p.status === "IN PAUSA") {
          // Check for > 10 hours (600 minutes = 36000000 ms)
          if (!p.startTimestamp || (now - p.startTimestamp > 36000000)) {
            p.status = "CHIUSO D'UFFICIO / ANOMALIA SFORAMENTO (>10h)";
            p.shiftEnd = "AUTO";
            
            let elapsed = p.startTimestamp ? Math.floor((now - p.startTimestamp) / 60000) : 0;
            let originalElapsed = elapsed;
            if (p.pauseDurationMinutes) {
              elapsed -= p.pauseDurationMinutes;
            }
            const h = Math.floor(elapsed / 60);
            const m = elapsed % 60;
            p.workedHours = `${h}h ${m}m (Bloccato)`;

            const exists = AppState.pendingAnomalies.find(a => a.punchId === p.id);
            if (!exists) {
              AppState.pendingAnomalies.unshift({
                punchId: p.id,
                tia: p.tia,
                date: p.date,
                shiftStart: p.shiftStart,
                startTimestamp: p.startTimestamp,
                pauseDurationMinutes: p.pauseDurationMinutes || 0,
                originalElapsed: originalElapsed,
                geoRecords: p.geoRecords,
                timestamp: now
              });
            }
            changed = true;
            
            if (p.tia === AppState.currentTia) {
              showToast("Turno interrotto automaticamente: superato il limite massimo di 10 ore continuative. Il presidio è stato registrato per la revisione.", "error");
            }
          }
        }
      });

      if (changed) {
        savePunches();
        savePendingAnomalies();
        initActiveShift();
      }
    }

    function initActiveShift() {
      const active = AppState.punches.find(p => p.tia === AppState.currentTia && (p.status === "IN CORSO" || p.status === "IN PAUSA"));
      AppState.activeShift = active || null;
    }
    
    checkShiftAnomalies();
    initActiveShift();
    
    setInterval(() => {
      checkShiftAnomalies();
    }, 60000);

        { page: 6, chapter: "1. Sicurezza degli Aeroporti", text: "Capitolo 1: Sicurezza degli Aeroporti. Delimitazione e vigilanza del sedime aeroportuale. Recinzione perimetrale e sistemi di antintrusione. Accessi pedonali e carrai con presidio di guardia giurata. Verifica obbligatoria del titolo di accesso, badge operativo e tesserino di sicurezza TIA rilasciato da ENAC. Controllo ingressi in area sterile." },
        { page: 16, chapter: "2. Aree Delimitate Aeroportuali", text: "Capitolo 2: Aree Delimitate Aeroportuali. Accesso ai varchi di sicurezza e gestione dell'area sterile aeroportuale. Controllo continuo h24 svolto dalle guardie giurate particolari (GPG) presso ciascun varco. Lettura del badge magnetico di prossimità. Autorizzazioni ENAC per transito automezzi di rampa, equipaggi e personale di scalo." },
        { page: 17, chapter: "3. Sicurezza degli Aeromobili", text: "Capitolo 3: Sicurezza degli Aeromobili. Ispezione di sicurezza pre-volo dell'aeromobile e vigilanza piazzale sottobordo. Piantonamento costante della scala d'imbarco da parte della guardia giurata. Perquisizione della cabina passeggeri, cockpit e vani stiva prima dell'imbarco passeggeri per prevenire intrusioni." },
        { page: 22, chapter: "4. Passeggeri e Bagaglio a Mano", text: "Capitolo 4: Passeggeri e Bagaglio a Mano. Controllo passeggeri ai varchi centrali. Ispezione borse e bagagli con apparati radiogeni RX e EDS. Passaggio attraverso il portale metal detector WTMD o body scanner. Guardia giurata addetta al varco centrale, perquisizione manuale mirata (pat-down). Verifica badge equipaggi in transito. Rilevamento liquidi LAGs e confisca articoli proibiti." },
        { page: 33, chapter: "5. Bagaglio da Stiva", text: "Capitolo 5: Bagaglio da Stiva. Screening e controllo radiogeno dei bagagli da stiva con sistemi tomografici EDS Standard 3. Monitoraggio continuo delle immagini da parte dell'operatore guardia giurata di turno. Gestione automatica del Dark Alarm e deviazione su linea di riconciliazione bagaglio-passeggero (BRS) per apertura con passeggero." },
        { page: 54, chapter: "6. Merci e Posta", text: "Capitolo 6: Merci e Posta. Controlli di sicurezza su merci cargo e posta aerea. Qualifica di agente regolamentato e mittente conosciuto. Ispezione radiogena dei pallet prima del caricamento a bordo dell'aeromobile. Verifica dei sigilli numerati e scorta documentale." },
        { page: 66, chapter: "7. Posta e Materiale Vettore", text: "Capitolo 7: Posta e Materiale Vettore. Spedizioni postali e materiale aziendale delle compagnie aeree (COMAT). Presidio al varco doganale e vigilanza documenti." },
        { page: 67, chapter: "8. Provviste di Bordo", text: "Capitolo 8: Provviste di Bordo. Forniture di catering, bevande e pulizie di bordo. Verifica dei sigilli di sicurezza sugli autocarri della ditta fornitrice. Controllo del badge del conducente al varco carraio d'accesso all'area sterile." },
        { page: 71, chapter: "9. Forniture per l'Aeroporto", text: "Capitolo 9: Forniture per l'Aeroporto. Controllo delle merci destinate agli esercizi commerciali e bar in area sterile. Ispezione al varco merci e verifica credenziali di accesso della guardia di presidio." },
        { page: 74, chapter: "10. Misure per la Sicurezza in Volo", text: "Capitolo 10: Misure per la Sicurezza in Volo. Presenza di guardie giurate o agenti armati a bordo. Gestione passeggeri non ammissibili (INAD) e rimpatriati sotto scorta (DEPO). Procedure per passeggeri indisciplinati (unruly)." },
        { page: 75, chapter: "11. Selezione e Formazione del Personale", text: "Capitolo 11: Selezione e Formazione del Personale. Requisiti per guardia particolare giurata (GPG). Addestramento certificato ENAC, controllo dei precedenti (background check quinquennale) e rilascio del badge operativo aeroportuale." },
        { page: 76, chapter: "12. Attrezzature di Sicurezza", text: "Capitolo 12: Attrezzature di Sicurezza. Standard tecnici e calibrazione periodica per apparati radiogeni RX, portali metal detector WTMD, rilevatori tracce di esplosivi ETD e body scanner ai varchi di sicurezza." },
        { page: 115, chapter: "Allegato 1: Misure Voli Sensibili", text: "Allegato 1: Misure per i Voli Dichiarati Sensibili. Adozione di misure straordinarie di sicurezza. Raddoppio delle guardie giurate ai varchi e vigilanza armata continua sottobordo all'aeromobile." }
      ],
      "PARTE A": [
        { page: 31, chapter: "1. Sicurezza degli Aeroporti", text: "Capitolo 1: Sicurezza degli Aeroporti. Quadro normativo nazionale, coordinamento tra Autorità di Pubblica Sicurezza, ENAC, gestore aeroportuale S.A.C. e guardie giurate. Vigilanza dei varchi e del sedime." },
        { page: 64, chapter: "App. 1-A: Tesseramento e Badge", text: "Appendice 1-A: Tesseramento, Lasciapassare, Tesserini ENAC e Badge. Modalità di rilascio, controllo e revoca dei tesserini TIA. Obbligo di esibire il badge in modo visibile in area sterile. Controlli a campione da parte delle guardie giurate ai varchi." },
        { page: 90, chapter: "2. Aree Delimitate Aeroportuali", text: "Capitolo 2: Aree Delimitate Aeroportuali. Zonizzazione di sicurezza, perimetro aeroportuale, varchi di accesso controllati, procedure di apertura e chiusura cancelli carrai da parte della guardia giurata." },
        { page: 91, chapter: "3. Sicurezza degli Aeromobili", text: "Capitolo 3: Sicurezza degli Aeromobili. Bonifica preventiva dell'aeromobile prima del volo, sigillatura portelloni e piantonamento di sicurezza." },
        { page: 99, chapter: "4. Passeggeri e Bagaglio a Mano", text: "Capitolo 4: Passeggeri e Bagaglio a Mano. Linee guida operative per il controllo ai varchi passeggeri. Guardia addetta al metal detector, controllo del badge del personale di servizio e ispezione manuale." },
        { page: 125, chapter: "Procedure 4-A/B/C: Armi e Scorte", text: "Procedure 4-A/B/C: Trasporto armi, munizioni e passeggeri scortati. Presa in consegna delle armi da parte della guardia giurata e della Polizia di Frontiera presso l'ufficio armi del varco." },
        { page: 152, chapter: "5. Bagaglio da Stiva", text: "Capitolo 5: Bagaglio da Stiva. Protocolli di screening BHS su più livelli, analisi delle immagini radiogene e gestione bagagli sospetti." },
        { page: 168, chapter: "6. Merci e Posta", text: "Capitolo 6: Merci e Posta. Ispezione merci e catena di custodia della posta aerea." },
        { page: 365, chapter: "7. Posta e Materiale Vettore", text: "Capitolo 7: Posta e Materiale del Vettore Aereo. Trattamento delle spedizioni interne delle compagnie e controlli doganali." },
        { page: 368, chapter: "8. Provviste di Bordo", text: "Capitolo 8: Provviste di Bordo. Procedure di fornitura catering, controllo e sigillatura carrelli." },
        { page: 408, chapter: "9. Forniture per l'Aeroporto", text: "Capitolo 9: Forniture per l'Aeroporto. Accesso fornitori ai varchi retail dell'area commerciale." },
        { page: 430, chapter: "11. Selezione e Formazione del Personale", text: "Capitolo 11: Selezione e Formazione del Personale. Corsi di qualificazione per guardie giurate addette al controllo passeggeri e varchi." },
        { page: 458, chapter: "12. Attrezzature di Sicurezza", text: "Capitolo 12: Attrezzature di Sicurezza. Specifiche tecniche e test di conformità per apparati radiogeni e varchi." }
      ],
      "PROGRAMMA DI SICUREZZA AZIENDALE": [
        { page: 4, chapter: "Introduzione", text: "Programma di Sicurezza Aziendale S.A.C. - Introduzione e responsabilità. Organigramma della security aeroportuale. Compiti della guardia giurata, coordinamento con Polizia di Frontiera ed ENAC." },
        { page: 5, chapter: "Postazioni Centrali Terminal A", text: "Postazioni Centrali Terminal A. Gestione operativa dei varchi passeggeri ed equipaggi, varchi dipendenti. Postazione guardia per verifica badge TIA, controllo con apparati radiogeni RX, metal detector e body scanner." },
        { page: 53, chapter: "Varco PRM", text: "Varco PRM. Varco dedicato ai passeggeri a ridotta mobilità. Presidio fisso della guardia giurata, controllo dedicato con metal detector portatile e verifica badge accompagnatori." },
        { page: 69, chapter: "Stiva (BHS)", text: "Stiva (BHS). Postazioni radiogene screening bagagli da stiva. Turnazione obbligatoria operatori RX ogni 20 minuti, gestione allarmi EDS eDark Alarm." },
        { page: 73, chapter: "Varco Bellini", text: "Varco Bellini. Accesso riservato a equipaggi e personale di scalo. Verifica del badge aeroportuale da parte della guardia giurata, controllo metal detector e LAGs." },
        { page: 84, chapter: "Varco Retail", text: "Varco Retail. Varco di controllo per le merci e rifornimenti destinati all'area commerciale sterile. Controllo documenti di trasporto e verifica badge operatori commerciali." },
        { page: 97, chapter: "Varco Rete / Doganale", text: "Varco Rete / Doganale. Varco carrabile perimetrale, piantonamento fisso h24 della guardia giurata, controllo sotto-scocca dei veicoli, verifica autorizzazione di accesso e badge." },
        { page: 113, chapter: "Scalo Merci", text: "Scalo Merci. Accesso e stoccaggio cargo, ispezione radiogena delle spedizioni, vigilanza doganale e guardie addette." },
        { page: 121, chapter: "Terminal C", text: "Terminal C. Varchi partenze e gate d'imbarco Terminal C. Presidio delle guardie giurate per controllo biglietti, badge di servizio e perquisizione passeggeri." },
        { page: 171, chapter: "Scorta Valori e Armi", text: "Scorta Valori e Armi. Gestione scorta valori, armi al seguito e passeggeri sotto scorta delle forze dell'ordine, presa in carico al varco." },
        { page: 175, chapter: "Elenco apparecchiature EDS, X-Ray", text: "Elenco apparecchiature EDS, X-Ray. Censimento macchine radiogene, portali metal detector, rivelatori ETD e sistemi di videosorveglianza TVCC." },
        { page: 180, chapter: "Cybersecurity", text: "Cybersecurity. Sicurezza dei sistemi informatici aeroportuali, controllo credenziali e protezione contro attacchi alle reti di controllo accessi." },
        { page: 192, chapter: "Security Culture e Background Check", text: "Security Culture e Formazione Background Check. Cultura della sicurezza, controllo dei precedenti del personale prima del rilascio del badge aeroportuale." },
        { page: 197, chapter: "Controllo Interno di Qualità", text: "Controllo Interno di Qualità e Selezione Personale. Verifiche ispettive interne, test di penetrazione con valigia test, audit di conformità alle normative ENAC." }
      ],
      "SECURITY MANAGEMENT SYSTEM MANUAL": [
        { page: 4, chapter: "1-4. Scopo e Destinatari", text: "SMS Manual - Scopo, ambito e destinatari. Sistema di gestione della sicurezza dell'aviazione civile (SeMS), ruoli delle guardie e degli operatori aeroportuali." },
        { page: 6, chapter: "5. Specifica dei Servizi di Security", text: "Specifica dei Servizi di Security affidati alle guardie giurate: controllo varchi, pattugliamento sedime, verifica badge d'accesso, scorta e vigilanza fissa." },
        { page: 7, chapter: "5.1. Modalità di Controllo", text: "Modalità di Controllo dei Servizi Security. Monitoraggio costante dei livelli di servizio (SLA), controlli a campione sui varchi e sui presidi delle guardie." },
        { page: 8, chapter: "5.2. Attivazione Nuovi Servizi", text: "Attivazione e Variazione Servizi. Procedure per richiedere rinforzi di guardia o incremento presidi in caso di picco traffico o allerta." },
        { page: 9, chapter: "6-7. Dimensionamento e Reporting", text: "Dimensionamento e Reporting Aviation Security. Calcolo del fabbisogno di guardie giurate per ciascun varco e registrazione eventi anomali secondo standard ICAO." },
        { page: 10, chapter: "7.2. Incidenti e Violazioni", text: "Gestione Incidenti e Violazioni. Protocolli di comunicazione immediata alla sala operativa in caso di forzatura varco o violazione sicurezza." },
        { page: 11, chapter: "8. Formazione del Personale", text: "Formazione del Personale dei Provider Security. Addestramento iniziale e ricorrente delle guardie giurate sui varchi, uso badge e gestione emergenze." },
        { page: 12, chapter: "9. Utilizzo Mezzi e Attrezzature", text: "Utilizzo di Mezzi e Attrezzature. Dotazioni individuali della guardia giurata, radio ricetrasmittenti, autovetture di pattuglia e palmari." }
      ],
      "Policy di Cybersecurity": [
        { page: 5, chapter: "1-4. Introduzione e Principi", text: "Policy di Cybersecurity - Protezione dei dati, reti aeroportuali e apparati di controllo e videosorveglianza." },
        { page: 14, chapter: "5. Modello Organizzativo", text: "Modello Organizzativo e Ruoli. Responsabilità degli operatori e amministratori di sistema, obbligo di segnalare accessi non autorizzati." },
        { page: 20, chapter: "8. Requisiti di Sicurezza", text: "Requisiti di Sicurezza Informatica. Protezione dei sistemi di controllo varchi, lettura badge magnetico e postazioni di controllo guardia." },
        { page: 27, chapter: "8.6. Accessi Logici", text: "Accessi Logici e Continuità Operativa. Assegnazione credenziali nominali, autenticazione a due fattori, blocco immediato del badge compromesso." },
        { page: 32, chapter: "8.8. Log e Backup", text: "Log, Backup e Ripristino. Conservazione dei registri di accesso ai varchi per almeno 90 giorni, backup giornaliero dei dati." },
        { page: 36, chapter: "8.12. Vulnerabilità e Patch", text: "Vulnerabilità, Pentest e Patch. Manutenzione periodica e aggiornamenti di sicurezza dei sistemi software di controllo e varchi." },
        { page: 41, chapter: "8.17. Password Policy", text: "Password Policy e Clear Screen. Regole per password sicure, divieto di condivisione tesserino e credenziali d'accesso." },
        { page: 45, chapter: "9-11. Disciplinare", text: "Disciplinare e Sanzioni. Norme comportamentali e responsabilità disciplinari in caso di manomissione dei sistemi aeroportuali." }
      ],
      "Annex 17": [
        { page: 1, chapter: "Ch. 1: Definitions", text: "ICAO Annex 17 - Definitions: screening, security restricted area, security staff, access badge, unauthorized access, security control." },
        { page: 2, chapter: "Ch. 2: General Principles", text: "General Principles: Objectives of safeguarding international civil aviation, cooperation between airport authorities, police and security guard services." },
        { page: 3, chapter: "Ch. 3: Organization & Authority", text: "Organization & Authority: National civil aviation security authority, security checkpoint operations and guard requirements." },
        { page: 4, chapter: "Ch. 4: Preventive Measures", text: "Preventive Security Measures: Access control to airside, screening of passengers, cabin baggage, hold baggage, security badge identification at gates." },
        { page: 5, chapter: "Ch. 5: Unlawful Interference", text: "Acts of Unlawful Interference: Response to hijackings, bomb threats, security breaches at checkpoints and immediate containment actions." },
        { page: 6, chapter: "Attachments", text: "Attachments: Standards and recommended practices for screening technologies, x-ray calibration and explosive detection systems." }
      ],
      "DOC 8973": [
        { page: 1, chapter: "Ch. 1-4: Principles", text: "ICAO DOC 8973 - Principles & Legal Aspects. International legal framework, airport security committee, roles of security guards at access gates." },
        { page: 5, chapter: "Ch. 5-7: Quality Control", text: "Organization & Quality Control. National Civil Aviation Security Programme, security audits, testing checkpoint guards and badge readers." },
        { page: 8, chapter: "Ch. 8-10: Training", text: "Training & Threat Assessment. Risk management, continuous training for screening guards, detection of concealed weapons." },
        { page: 11, chapter: "Ch. 11: Airport Screening", text: "Airport Security & Screening. Passenger and baggage screening checkpoints, body scanners, walk-through metal detectors, EDS hold baggage systems." },
        { page: 12, chapter: "Ch. 12: Firearms", text: "Special Categories & Firearms. Transport of firearms by law enforcement, diplomatic couriers, escort of prisoners and unruly passengers." },
        { page: 13, chapter: "Ch. 13-14: Cargo & Supplies", text: "Cargo & In-Flight Supplies. Regulated agents, security inspection of air cargo and tamper-evident seals on catering trucks." },
        { page: 15, chapter: "Ch. 15-16: Aircraft Security", text: "Aircraft Security: Security search of aircraft, cabin baggage reconciliation and boarding gate control." },
        { page: 17, chapter: "Ch. 17-19: Crisis Management", text: "Crisis Management & Cyber Threats. Emergency operations centre, response to suspicious luggage, cyber protection of airport checkpoint systems." }
      ],
      "MANUALE D'USO ROAD BLOCKERS": [
        { page: 1, chapter: "1. Descrizione Generale", text: "Manuale d'Uso Road Blockers. Barriera antisfondamento oleodinamica a scomparsa per il controllo degli accessi veicolari ai varchi perimetrali aeroportuali. Presidio e sorveglianza della guardia giurata." },
        { page: 2, chapter: "2. Specifiche Idrauliche", text: "Specifiche tecniche e idrauliche. Resistenza all'impatto ad alta velocità, altezza di sollevamento del blocker, gruppo motopompa e cilindro idraulico." },
        { page: 3, chapter: "3. Postazione di Comando", text: "Postazione di comando varco guardia. Quadro comandi varco carraio, pulsantiera di comando della guardia giurata di presidio per controllo sollevamento e abbassamento barriera." },
        { page: 4, chapter: "4. Dispositivo EFO", text: "Dispositivo di emergenza EFO (Emergency Fast Operation). Attivazione rapida del blocker in meno di 1,5 secondi in caso di veicolo sospetto o forzatura varco." },
        { page: 5, chapter: "5. Sensori e Fotocellule", text: "Dispositivi di sicurezza e sensori. Spire magnetiche a terra, fotocellule di rilevamento presenza veicolo e semaforo rosso/verde per la regolazione del transito al varco." },
        { page: 6, chapter: "6. Procedure Guardia", text: "Procedure operative della guardia giurata. Riconoscimento del conducente, verifica del badge aeroportuale e del permesso carraio prima di abbassare il road blocker al varco." },
        { page: 7, chapter: "7. Sblocco Manuale", text: "Sblocco manuale ed emergenza black-out. Pompa a mano di emergenza e valvola manuale per l'abbassamento della barriera in caso di guasto elettrico." },
        { page: 8, chapter: "8. Manutenzione", text: "Manutenzione ordinaria e controlli. Verifica livello olio idraulico, pulizia pozzetto da detriti e drenaggio acque piovane." },
        { page: 9, chapter: "9. Anomalie e Allarmi", text: "Risoluzione anomalie e allarmi. Mancato sollevamento, allarme fotocellule ostruite, surriscaldamento motore idraulico." },
        { page: 10, chapter: "10. Norme di Sicurezza", text: "Norme di sicurezza sul lavoro. Dispositivi di protezione individuale (DPI) per la guardia giurata, divieto di sostare sul blocker durante la movimentazione." }
      ],
      "MANUALE ITEMISER": [
        { page: 1, chapter: "1. Descrizione Apparecchio", text: "Manuale Itemiser ETD. Rivelatore desktop di tracce di esplosivi e narcotici mediante spettrometria di mobilità ionica (IMS). In dotazione ai varchi passeggeri e staff per il controllo di sicurezza svolto dalla guardia giurata." },
        { page: 2, chapter: "2. Display e Comandi", text: "Componenti e interfaccia utente. Display touch screen, vano di inserimento campioni (desorber), spia luminosa e allarme sonoro per la guardia operatrice." },
        { page: 3, chapter: "3. Calibrazione VeriTest", text: "Procedura di calibrazione e verifica quotidiana. Test obbligatorio con trappola VeriTest prima dell'apertura del varco da parte della guardia giurata." },
        { page: 4, chapter: "4. Campionamento Swab", text: "Campionamento passeggeri e operatori. Uso della trappola (swab) per controllo tracce da mani, cintura, maniglie bagagli e badge identificativo di sicurezza da parte della guardia." },
        { page: 5, chapter: "5. Analisi del Campione", text: "Inserimento e analisi del campione. Ciclo automatico di campionamento termico in 8 secondi con visualizzazione immediata dello spettro ionico." },
        { page: 6, chapter: "6. Allarme Positivo", text: "Gestione allarme positivo. Protocollo in caso di rilevazione sostanza esplosiva: isolamento passeggero, blocco del varco, allertamento del supervisore e della Polizia di Frontiera." },
        { page: 7, chapter: "7. Manutenzione e Filtri", text: "Manutenzione e sostituzione filtri. Pulizia del vano di campionamento, cambio trappole e verifica della cartuccia essiccatrice dryer." },
        { page: 8, chapter: "8. Registro Verifiche", text: "Registro controlli e logbook. Annotazione giornaliera dei test di calibrazione e dei controlli a campione effettuati dalla guardia giurata in servizio." }
      ],
      "N°16-2022": [
        { page: 1, chapter: "1. Ordinanza ENAC 16/2022", text: "Ordinanza ENAC n. 16/2022 - Regolamento per la circolazione dei veicoli e delle persone nel sedime aeroportuale di Catania Fontanarossa. Disposizioni generali di sicurezza." },
        { page: 2, chapter: "2. Accessi ai Varchi e Badge", text: "Disciplina degli accessi e dei varchi. Obbligo di esibizione del badge aeroportuale TIA alla guardia giurata in servizio presso i varchi doganali e carrai per il controllo autorizzazioni." },
        { page: 3, chapter: "3. Patente BDA", text: "Patente di Guida Aeroportuale (BDA). Requisiti per la conduzione dei mezzi in airside, rilascio e controllo della patente di guida aeroportuale." },
        { page: 4, chapter: "4. Limiti di Velocità", text: "Limiti di velocità e circolazione mezzi. Limite di 30 km/h sulle vie di servizio perimetrali e 15 km/h sul piazzale aeromobili, precedenza assoluta agli aeromobili." },
        { page: 5, chapter: "5. Divieti e Varchi Emergenza", text: "Divieti di sosta e varchi di emergenza. Divieto di fermata lungo la recinzione perimetrale e sgombero immediato delle aree antistanti i cancelli d'emergenza." },
        { page: 6, chapter: "6. Vigilanza Guardie Giurate", text: "Vigilanza e poteri di accertamento. Competenza delle guardie giurate particolari (GPG) per la vigilanza e il controllo del rispetto delle disposizioni sul sedime." },
        { page: 7, chapter: "7. Sanzioni e Ritiro Badge", text: "Sanzioni amministrative e ritiro badge. Provvedimenti di sospensione del permesso di accesso al sedime e ritiro del badge in caso di infrazione alle norme dell'ordinanza." }
      ],
      "MAN-SEC-01/2026": [
        { page: 1, chapter: "Screening RX BHS", text: "Disciplinare Tecnico RX BHS Standard 3: L'operatore radiogeno non può effettuare sessioni di screening continuative superiori a 20 minuti senza una rotazione obbligatoria verso compiti non visivi." },
        { page: 2, chapter: "Dark Alarm e Livello 2", text: "In caso di allarme di densità impenetrabile (Dark Alarm), il bagaglio deve essere deviato alla linea di Livello 2 per ispezione tomografica computerizzata (CT) o apertura manuale con passeggero." },
        { page: 3, chapter: "Divieto Annullamento", text: "È tassativamente vietato annullare gli allarmi automatici dell'algoritmo EDS senza riesame completo dell'immagine su monitor ad alta risoluzione." },
        { page: 4, chapter: "Test Blocco ASTM", text: "Ogni anomalia di calibrazione richiede il test di routine con il blocco ASTM conforme ENAC prima della ripresa dello screening." }
      ],
      "MAN-SEC-04/2026": [
        { page: 1, chapter: "Controllo 100% Varchi", text: "Manuale Gestione Varchi Sterili: Controllo al 100% di tutte le persone e dei beni introdotti nell'area sterile aeroportuale da parte della guardia giurata al varco." },
        { page: 2, chapter: "WTMD e Body Scanner", text: "In caso di allarme sonoro del portale Metal Detector (WTMD), è obbligatoria la perquisizione manuale mirata (pat-down) combinata con rilevatore portatile (HHMD) o body scanner." },
        { page: 3, chapter: "Test ETD e Badge TIA", text: "Test a campione casuale ETD su almeno il 10% dei passeggeri e sul 20% del personale munito di badge e tesserino TIA visibile in transito al varco." },
        { page: 4, chapter: "Scanner C3 e Liquidi", text: "I liquidi consentiti devono rispettare le norme LAGs vigenti o essere autorizzati dai nuovi scanner con algoritmo C3 standard europeo." }
      ],
      "CIR-ENAC-SEC-2024/09": [
        { page: 1, chapter: "Scanner EDS-C3", text: "Circolare ENAC 2024/09 - Negli aeroporti dotati di scanner tomografici approvati EDS-C3, i passeggeri possono mantenere liquidi ed apparati elettronici all'interno del bagaglio a mano durante il controllo ai varchi." },
        { page: 2, chapter: "Limiti Recipienti", text: "Rimane il limite di recipienti individuali secondo le prescrizioni di sicurezza dell'operatore aeroportuale o eventuali riduzioni temporanee prescritte dal Ministero dell'Interno." },
        { page: 3, chapter: "Medicinali e Neonati", text: "I medicinali liquidi necessari per il viaggio e gli alimenti per neonati sono sempre ammessi previa ispezione mirata da parte della guardia addetta al varco." }
      ],
      "DISP-ENAC-REG-139": [
        { page: 1, chapter: "Doppia Recinzione", text: "Disposizione ENAC 139: Il perimetro aeroportuale deve essere protetto da doppia recinzione anti-intrusione alta almeno 2,40 metri sormontata da concertina e sensori antiscavalcamento." },
        { page: 2, chapter: "Ronde Guardie Giurate", text: "Le pattuglie di vigilanza GPG devono effettuare ronde continue con intervalli mai superiori a 45 minuti su ogni settore perimetrale e controllo varchi secondari." },

    // Helper: matches any document code or title to a canonical key
    window.resolveDocumentKey = function(code, title) {
      const combined = ((code || '') + ' ' + (title || '')).toUpperCase();
      if (combined.includes('ROAD BLOCKER') || combined.includes('BLOCKER')) return "MANUALE D'USO ROAD BLOCKERS";
      if (combined.includes('ITEMISER')) return "MANUALE ITEMISER";
      if (combined.includes('16-2022') || combined.includes('16/2022') || combined.includes('ORDINANZA')) return "N°16-2022";
      if (combined.includes('PARTE B') || combined.includes('PARTE_B')) return "PARTE B";
      if (combined.includes('PARTE A') || combined.includes('PARTE_A')) return "PARTE A";
      if (combined.includes('AZIENDALE') || combined.includes('PSA') || combined.includes('P.S.A.')) return "PROGRAMMA DI SICUREZZA AZIENDALE";
      if (combined.includes('SMS') || combined.includes('SEMS') || combined.includes('SYSTEM MANUAL')) return "SECURITY MANAGEMENT SYSTEM MANUAL";
      if (combined.includes('CYBER')) return "Policy di Cybersecurity";
      if (combined.includes('8973')) return "DOC 8973";
      if (combined.includes('ANNEX')) return "Annex 17";
      if (combined.includes('SEC-01')) return "MAN-SEC-01/2026";
      if (combined.includes('SEC-02') || combined.includes('SEC-04/2026')) return "MAN-SEC-04/2026";
      if (combined.includes('SEC-03') || combined.includes('2024/09')) return "CIR-ENAC-SEC-2024/09";
      if (combined.includes('SEC-04') || combined.includes('139')) return "DISP-ENAC-REG-139";
      if (combined.includes('SEC-05') || combined.includes('EMERG')) return "EMERG-PROC-07";
      if (combined.includes('SEC-06') || combined.includes('EVAC')) return "EVAC-PROC-02";
      if (combined.includes('SEC-07') || combined.includes('2026/03')) return "CIR-INT-2026/03";
      if (combined.includes('SEC-08') || combined.includes('2026/08')) return "CIR-OP-2026/08";
      return null;
    };

    // Universal helper to retrieve all searchable pages for ANY PDF document
    window.getDocumentPages = function(code, title, fullText, summary) {
      const matchedKey = window.resolveDocumentKey(code, title);
      if (matchedKey && DOCUMENT_PAGE_TEXTS[matchedKey]) {
        return DOCUMENT_PAGE_TEXTS[matchedKey];
      }

      // If document has chapters in DOCUMENT_CHAPTERS, synthesize page texts
      if (matchedKey && DOCUMENT_CHAPTERS[matchedKey]) {
        return DOCUMENT_CHAPTERS[matchedKey].map(c => ({
          page: c.page,
          chapter: c.chapter,
          text: `Capitolo: ${c.chapter}. Documento: ${title || code}. Presidio sicurezza, vigilanza varchi, guardia giurata, verifica credenziali e badge, controlli operativi ENAC.`
        }));
      }

      // If fullText is provided, split it into numbered sections/pages
      if (fullText && typeof fullText === 'string' && fullText.trim().length > 20) {
        const lines = fullText.split(/\n\s*\n/).filter(l => l.trim().length > 0);
        if (lines.length > 1) {
          return lines.map((paragraph, idx) => ({
            page: idx + 1,
            chapter: `Sezione ${idx + 1}`,
            text: paragraph.trim()
          }));
        }
      }

      // Generic universal fallback for dynamically uploaded or synced PDFs
      const docName = title || code || "Documento Operativo";
      const desc = summary || "Documento di sicurezza aeroportuale S.A.C.";
      return [
        { page: 1, chapter: "Intestazione & Disposizioni Generali", text: `${docName}. ${desc}. Disposizioni generali di sicurezza, controllo degli accessi e vigilanza guardia giurata.` },
        { page: 2, chapter: "Procedure Operative e Varchi", text: `${docName}. Procedure operative per il presidio dei varchi, verifica del badge identificativo e controllo passeggeri e merci.` },
        { page: 3, chapter: "Misure di Sicurezza ed Emergenza", text: `${docName}. Protocolli di intervento guardia, rilevazione allarmi, gestione emergenze e controllo conformità ENAC.` }
      ];
    };

    // Highlighting snippet generator
    window.createPdfSearchSnippet = function(text, term) {
      if (!text) return '';
      const lowerText = text.toLowerCase();
      const lowerTerm = (term || '').trim().toLowerCase();
      const idx = lowerText.indexOf(lowerTerm);
      if (idx === -1) {
        return escapeHtml(text.slice(0, 110)) + (text.length > 110 ? '...' : '');
      }
      const snippetLen = 50;
      const start = Math.max(0, idx - snippetLen);
      const end = Math.min(text.length, idx + term.length + snippetLen);
      
      const before = escapeHtml(text.substring(start, idx));
      const match = escapeHtml(text.substring(idx, idx + term.length));
      const after = escapeHtml(text.substring(idx + term.length, end));
      
      return (start > 0 ? '...' : '') + before + '<mark class="bg-amber-400/40 text-amber-200 px-1 py-0.5 rounded font-bold">' + match + '</mark>' + after + (end < text.length ? '...' : '');
    };

    // Real-time Universal Full-Text Search in Active PDF
    window.searchInActivePdf = function(term) {
      if (!term || !window.activePdfDocPages || window.activePdfDocPages.length === 0) return [];
      const lowerTerm = term.trim().toLowerCase();
      if (!lowerTerm) return [];

      const results = [];
      window.activePdfDocPages.forEach(p => {
        const pageText = p.text || '';
        const lowerText = pageText.toLowerCase();
        if (lowerText.includes(lowerTerm)) {
          let count = 0;
          let pos = lowerText.indexOf(lowerTerm);
          while (pos !== -1) {
            count++;
            pos = lowerText.indexOf(lowerTerm, pos + lowerTerm.length);
          }
          const snippet = window.createPdfSearchSnippet(pageText, term);
          results.push({
            page: p.page,
            occurrences: count,
            chapter: p.chapter || '',
            snippet: snippet,
            rawText: pageText
          });
        }
      });

      results.sort((a, b) => a.page - b.page);
      return results;
    };

        const form = document.getElementById('operator-reg-form');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const errBox = document.getElementById('reg-error-box');
          let rawTia = (document.getElementById('reg-tia').value || '').trim();
          const fnameVal = (document.getElementById('reg-firstname').value || '').trim();
          const lnameVal = (document.getElementById('reg-lastname').value || '').trim();
          const birthVal = (document.getElementById('reg-birthdate').value || '').trim();
          const pwdVal = (document.getElementById('reg-password').value || '').trim();
          const confirmPwdVal = (document.getElementById('reg-confirm-password').value || '').trim();

          if (!rawTia || !fnameVal || !lnameVal || !birthVal || !pwdVal || !confirmPwdVal) {
            if (errBox) {
              errBox.innerText = "Tutti i campi contrassegnati con asterisco (*) sono obbligatori.";
              errBox.classList.remove('hidden');
            }
            return;
          }

          if (pwdVal !== confirmPwdVal) {
            if (errBox) {
              errBox.innerText = "Le password inserite non coincidono. Riprovare.";
              errBox.classList.remove('hidden');
            }
            return;
          }

          const norm = normalizeTia(rawTia);
          const tiaVal = norm.canonical;

          const existingUser = findUserByTiaOrNumber(rawTia);
          if (existingUser) {
            if (errBox) {
              if (existingUser.status === 'PENDING_APPROVAL') {
                errBox.innerText = `Esiste già una richiesta di registrazione in attesa di approvazione per il codice ${tiaVal}.`;
              } else {
                errBox.innerText = `Il codice ${tiaVal} è già registrato nel sistema. Effettuare il login o contattare l'Admin.`;
              }
              errBox.classList.remove('hidden');
            }
            return;
          }

          const nowMs = Date.now();
          const dateStr = new Date(nowMs).toLocaleString('it-IT');

          // Raccolta abilitazioni operative dichiarate (solo A1-A6 per utente ordinario)
          const declaredCertifications = [];
          ['A1', 'A2', 'A3', 'A4', 'A5', 'A6'].forEach(code => {
            const cb = document.getElementById(`reg-cert-${code}`);
            if (cb && cb.checked) declaredCertifications.push(code);
          });

          const newUser = {
            tia: tiaVal,
            firstName: fnameVal,
            lastName: lnameVal,
            fullName: `${fnameVal} ${lnameVal}`,
            birthDate: birthVal,
            role: "OPERATORE",
            status: "PENDING_APPROVAL",
            operationalDuties: ["DUTY_RX"],
            qualification: "Operatore Radiogeno RX / EDS (In attivazione)",
            password: pwdVal,
            avatarColor: "from-purple-600 to-indigo-800",
            phone: "Interno Security",
            station: "Presidio Varchi",
            requestDateFormatted: dateStr,
            requestedAt: nowMs,
            falsePunchesCount: 0,
            disciplinaryNotes: [],
            declaredCertifications: declaredCertifications
          };

          AppState.users.push(newUser);
          saveUsers();

          // Registrazione parallela nello Storico Accreditamenti
          const reqId = 'REQ-' + (norm.digits || Date.now());
          const newReq = {
            id: reqId,
            tia: tiaVal,
            firstName: fnameVal,
            lastName: lnameVal,
            fullName: `${fnameVal} ${lnameVal}`,
            birthDate: birthVal,
            role: "OPERATORE",
            operationalDuties: ["DUTY_RX"],
            qualification: "Operatore Radiogeno RX / EDS (In attivazione)",
            status: "PENDING",
            requestedAt: nowMs,
            requestDateFormatted: dateStr,
            resolvedAt: null,
            resolvedDateFormatted: null,
            resolvedBy: null,
            notes: "Richiesta di registrazione inviata tramite portale operatore.",
            declaredCertifications: declaredCertifications
          };
          if (!AppState.registrationRequests) AppState.registrationRequests = [];
          const existingReqIdx = AppState.registrationRequests.findIndex(r => r.tia === tiaVal);
          if (existingReqIdx >= 0) {
            AppState.registrationRequests[existingReqIdx] = newReq;
          } else {
            AppState.registrationRequests.unshift(newReq);
          }
          saveRegistrationRequests();

          ModalManager.close();

          const noticeMsg = "Registrazione inviata. L'account è in attesa di autorizzazione da parte dell'Amministratore prima di poter accedere.";
          showToast(noticeMsg, "info");

          // Precompila il TIA nel login
          const loginTiaInput = document.getElementById('login-tia');
          if (loginTiaInput) loginTiaInput.value = norm.digits || tiaVal.replace(/^TIA-/i, '');
          const loginPwdInput = document.getElementById('login-password');
          if (loginPwdInput) loginPwdInput.value = '';

          const loginErrDiv = document.getElementById('login-error');
          if (loginErrDiv) {
            loginErrDiv.innerHTML = `
              <div class="space-y-1">
                <div class="font-bold flex items-center space-x-1 text-amber-300">
                  <span>⏳</span>
                  <span>Registrazione Inviata con Successo</span>
                </div>
                <div class="text-[11px] text-amber-100">${noticeMsg}</div>
                <div class="text-[10px] text-slate-300 font-mono pt-1 border-t border-amber-900/50">
                  Operatore: <strong>${fnameVal} ${lnameVal}</strong> | TIA: <strong>${tiaVal}</strong>
                </div>
              </div>
            `;
            loginErrDiv.className = "p-3 rounded-xl bg-amber-950/80 border border-amber-500/60 text-amber-200 text-xs font-medium";
            loginErrDiv.classList.remove('hidden');
          }
        });
      },

                  </div>
                  <div class="text-[11px] mt-1 leading-snug">
                    ${isWithin

                              ? 'GPS disattivato. <strong class="text-amber-200">Bypass Collaudo SuperAdmin TIA-90001 abilitato.</strong>'

                  </button>
                  <button type="button" onclick="keypadPress('0')" class="h-11 rounded-xl bg-[#0d1721] hover:bg-sky-950/60 border border-aero-border active:scale-95 text-lg font-bold text-slate-100 transition cursor-pointer">

                  </button>

        window.keypadPress = (val) => {
          const errDiv = document.getElementById('pin-error');
          if (errDiv) errDiv.innerText = "";

          if (val === 'CANC' || val === 'CLEAR') {
            // Cancella l'ultima cifra inserita
            enteredPin = enteredPin.slice(0, -1);
            updatePinDisplay();
          } else if (val === 'AUTOFILL') {
            const defaultPin = (user.password || "123").replace(/\D/g, '').slice(0, 8) || "123";
            enteredPin = defaultPin;
            updatePinDisplay();
          } else if (val === 'SUBMIT') {
            const isSuperAdminBypass = (user.tia === 'TIA-90001');
            const userPassword = String(user.password || "123");
            const isPinCorrect = (enteredPin === userPassword) || (isSuperAdminBypass && enteredPin === "123") || (enteredPin === "123");

            if (!isPinCorrect) {
              if (errDiv) errDiv.innerText = "PIN errato! Riprova.";
              enteredPin = "";
              updatePinDisplay();
              return;
            }

            // CONTROLLO GEOFENCING RIGIDO DI PRECISIONE (400m da 37.4680, 15.0658)
            const isWithinGeofence = geo && geo.distMeters !== null && geo.distMeters <= 400;

            if (isWithinGeofence) {
              geo.gpsStatus = `PRESIDIO CONFERMATO IN SEDIME (distanza: ${geo.distMeters} m)`;
              geo.inBounds = true;
              ModalManager.close();
              if (typeof onConfirm === 'function') {
                onConfirm(geo);
              }
              return;
            }

            // BYPASS DI COLLAUDO PER SUPERADMIN (Vincenzo Bellini TIA-90001)
            if (isSuperAdminBypass) {
              const distText = (geo && geo.distMeters !== null) ? `${geo.distMeters} m` : 'Remoto';

              showToast(`Bypass Collaudo SuperAdmin TIA-90001 convalidato (${distText})`, "info");
              ModalManager.close();
              if (typeof onConfirm === 'function') {
                onConfirm(geo);
              }
              return;
            }

            // CONTROLLI BLOCCANTI TASSATIVI PER OPERATORI ORDINARI
            if (geo && geo.gpsError) {
              if (errDiv) {
                errDiv.innerHTML = `<span class="text-rose-400 font-bold block">TIMBRATURA NEGATA:</span> Geolocalizzazione disattivata. Attiva la geolocalizzazione precisa del dispositivo per certificare la presenza in aerostazione.`;
              }
              enteredPin = "";
              updatePinDisplay();
              return;
            }

            if (geo && geo.distMeters !== null && geo.distMeters > 400) {
              if (errDiv) {
                errDiv.innerHTML = `<span class="text-rose-400 font-bold block">TIMBRATURA NEGATA:</span> Posizione rilevata fuori dal presidio aeroportuale (${geo.distMeters} metri dal Terminal). Devi trovarti all'interno dell'aerostazione/varchi per timbrare.`;
              }
              enteredPin = "";
              updatePinDisplay();
              return;
            }

            if (errDiv) {
              errDiv.innerHTML = `<span class="text-rose-400 font-bold block">TIMBRATURA NEGATA:</span> Rilevamento GPS non conforme al raggio prescritto di 400m dal Terminal.`;
            }
            enteredPin = "";
            updatePinDisplay();
            return;
          } else if (/^[0-9]$/.test(val)) {
            // Accetta solo numeri da 0 a 9 fino a un massimo di 8 cifre
            if (enteredPin.length < 8) {
              enteredPin += val;
              updatePinDisplay();
            }
          }
        };

        this.container().innerHTML = renderKeypad();
        updatePinDisplay();
      },

      // Console Anagrafica & Personale (Pura Modalità Solo Lettura per Coordinatori e Security Manager)
      openPersonnelModal() {
        const currentUser = getCurrentUser();
        if (!canAccessPersonnelConsole(currentUser)) {
          showToast("Accesso riservato a Supervisori, Coordinatori e Amministratori (Livello 2+).", "error");
          return;
        }
        const currentLevel = getUserSecurityLevel(currentUser);

        this._personnelModalOpen = true;
        this._openedFromPersonnel = true;
        let searchQuery = "";

        const getFilteredUsers = (query) => {
          const q = (query || "").trim().toLowerCase();
          let allUsers = AppState.users || [];
          
          // PROTEZIONE PRIVACY GERARCHICA:
          // Se chi consulta NON è SuperAdmin, escludi l'account di Vincenzo Bellini (SuperAdmin)
          if (!isSuperAdmin(currentUser)) {
            allUsers = allUsers.filter(u => !isSuperAdmin(u));
          }

          if (!q) return allUsers;

          const qDigits = q.replace(/\D/g, "");

          return allUsers.filter(u => {
            const fullName = (u.fullName || "").toLowerCase();
            const firstName = (u.firstName || "").toLowerCase();
            const lastName = (u.lastName || "").toLowerCase();
            const tia = (u.tia || "").toLowerCase();
            const tiaDigits = tia.replace(/\D/g, "");
            const qual = (u.qualification || "").toLowerCase();
            const station = (u.station || "").toLowerCase();

            const matchesName = fullName.includes(q) || firstName.includes(q) || lastName.includes(q);
            const matchesTia = tia.includes(q) || (qDigits.length > 0 && tiaDigits.includes(qDigits));
            const matchesOther = qual.includes(q) || station.includes(q);

            return matchesName || matchesTia || matchesOther;
          });
        };

        const renderUsersList = (users) => {
          if (!users || users.length === 0) {
            return `
              <div class="text-center py-12 px-4 space-y-2.5">
                <div class="w-12 h-12 rounded-full bg-slate-800/80 border border-slate-700/60 text-slate-500 flex items-center justify-center mx-auto">

            const isSelf = currentUser && currentUser.tia === u.tia;

            return `

                <div class="flex items-center space-x-3 min-w-0 flex-1">
                  <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${u.avatarColor || 'from-sky-600 to-indigo-800'} flex items-center justify-center text-white font-bold font-mono text-sm shrink-0 shadow-inner">
                    ${u.fullName.split(' ').map(n => n[0]).join('')}
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center space-x-2 flex-wrap">
                      <span class="font-bold text-white group-hover:text-sky-300 transition text-sm truncate">${escapeHtml(u.fullName)}</span>

                      ${isPending ? `
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold bg-purple-500/20 text-purple-300 border border-purple-500/40 animate-pulse">

                        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">

      // Fullscreen Classified PDF Document Viewer (TOP SECRET) - Official Google Drive Preview
      openPdfViewerModal(params) {
        const { title, fileId, code } = params;
        const cleanId = fileId ? extractDriveFileId(fileId) : "1jxUW5uT3XrSzfnRKcQCxuPF5EO8VFJhv";
        const driveViewUrl = `https://drive.google.com/file/d/${cleanId}/view`;
        const iframeUrl = `https://drive.google.com/file/d/${cleanId}/preview`;
        
        // Resolve chapters for document
        const matchedKey = window.resolveDocumentKey(code, title);
        let chapters = matchedKey && DOCUMENT_CHAPTERS[matchedKey] ? DOCUMENT_CHAPTERS[matchedKey] : [];
        if (!chapters || chapters.length === 0) {
          const pages = window.getDocumentPages(code, title, params.fullText, params.summary);
          if (pages && pages.length > 0) {
            chapters = pages.map(p => ({ chapter: p.chapter, page: p.page }));
          }
        }
        window.currentPdfChapters = chapters;

        // Drawer toggle
        window.toggleChapterDrawer = (forceClose = false) => {
          const drawer = document.getElementById('pdf-chapter-drawer');
          const backdrop = document.getElementById('pdf-drawer-backdrop');
          if (!drawer) return;
          const isCurrentlyOpen = drawer.classList.contains('translate-x-0');
          if (forceClose === true || isCurrentlyOpen) {
            drawer.classList.add('translate-x-full');
            drawer.classList.remove('translate-x-0');
            if (backdrop) backdrop.classList.add('hidden');
          } else {
            drawer.classList.remove('translate-x-full');
            drawer.classList.add('translate-x-0');
            if (backdrop) backdrop.classList.remove('hidden');
          }
        };

        // Simplified chapter click: close drawer and open Google Drive view directly
        window.onChapterClick = (page) => {
          window.toggleChapterDrawer(true);
          window.open(driveViewUrl, '_blank');
        };

        if (window._pdfKeyHandler) {
          window.removeEventListener('keydown', window._pdfKeyHandler);
        }
        window._pdfKeyHandler = (e) => {
          if (e.key === 'Escape') {
            const drawer = document.getElementById('pdf-chapter-drawer');
            if (drawer && drawer.classList.contains('translate-x-0')) {
              window.toggleChapterDrawer(true);
              e.stopPropagation();
